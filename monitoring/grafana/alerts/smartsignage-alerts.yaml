apiVersion: 1

groups:
  - orgId: 1
    name: smartsignage-core
    folder: SmartSignage
    interval: 1m
    rules:
      - uid: api-5xx
        title: API 5xx acima de 1% (5m)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                sum(rate(http_requests_total{job="backend",status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{job="backend"}[5m]))
              intervalMs: 60000
              maxDataPoints: 43200
        for: 5m
        annotations:
          severity: critical
        labels:
          service: backend
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: gt, value: 0.01}

      - uid: api-latency-p95
        title: API p95 > 500ms (5m)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |
                histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="backend"}[5m])) by (le))
              intervalMs: 60000
              maxDataPoints: 43200
        for: 5m
        annotations:
          severity: warning
        labels:
          service: backend
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: gt, value: 0.5}

      - uid: nginx-5xx
        title: Nginx 5xx > 0.5 rps (5m)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(rate(nginx_http_requests_total{status=~"5.."}[5m]))
              intervalMs: 60000
              maxDataPoints: 43200
        for: 5m
        annotations:
          severity: warning
        labels:
          service: nginx
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: gt, value: 0.5}

      - uid: totems-heartbeat-miss
        title: Totens sem heartbeat > 10m
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: count(max_over_time(smartsignage_totem_last_heartbeat_timestamp[10m]) == 0)
              intervalMs: 60000
              maxDataPoints: 43200
        for: 10m
        annotations:
          severity: critical
        labels:
          domain: business
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: gt, value: 0}

      - uid: infra-cpu
        title: CPU > 80% (10m)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: avg(100 - (irate(node_cpu_seconds_total{mode="idle"}[5m]) * 100))
              intervalMs: 60000
              maxDataPoints: 43200
        for: 10m
        annotations:
          severity: warning
        labels:
          domain: infra
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: gt, value: 80}

      - uid: infra-mem
        title: Memória livre < 15% (10m)
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: avg((node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)
              intervalMs: 60000
              maxDataPoints: 43200
        for: 10m
        annotations:
          severity: warning
        labels:
          domain: infra
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: lt, value: 15}

      - uid: infra-disk
        title: Disco livre < 15%
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: avg(100 * (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}))
              intervalMs: 60000
              maxDataPoints: 43200
        for: 10m
        annotations:
          severity: warning
        labels:
          domain: infra
        noDataState: NoData
        execErrState: Error
        isPaused: false
        thresholds:
          - {op: lt, value: 15}
