name: Tests and Quality Checks

on:
  push:
    branches: [ main, develop, 'versao-3.1-smartsignage-pro-inovacoes', 'Totem-Digital-V3x', 'Smart-Signage-Studio-V3x' ]
  pull_request:
    branches: [ main, develop, 'Totem-Digital-V3x', 'Smart-Signage-Studio-V3x' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartsignage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run linter
        working-directory: ./backend
        run: npm run lint || echo "Linter not fully configured"

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartsignage_test
          REDIS_URL: redis://localhost:6379
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          files: ./backend/coverage/lcov.info
          flags: backend-node${{ matrix.node-version }}
          name: backend-coverage-node${{ matrix.node-version }}

      - name: Check coverage threshold
        working-directory: ./backend
        run: |
          COVERAGE=$(node -e "const s=require('./coverage/coverage-summary.json'); console.log(s.total.lines.pct)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage is below 70%"
            exit 1
          else
            echo "✅ Coverage meets threshold"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run npm audit
        working-directory: ./backend
        run: npm audit --audit-level=high

  type-check:
    name: type-check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type check
        working-directory: ./backend
        run: npx tsc --noEmit

  frontend-build-studio:
    name: frontend build (Smart Signage Studio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js (with cache)
        id: setup_node_compact
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Node.js fallback (without cache)
        if: steps.setup_node_compact.outcome == 'failure'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify frontend lockfile
        run: |
          pwd
          ls -la
          ls -la frontend
          test -f frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Production build with REACT_APP_TOTEMDIGITAL_COMPACT (Studio)
        env:
          CI: true
          REACT_APP_TOTEMDIGITAL_COMPACT: 'true'
        run: npm run build --prefix frontend

  backend-test-studio-profile:
    name: backend tests (Studio profile env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Studio smoke tests (policy, runtime, billing, rotas)
        working-directory: ./backend
        env:
          NODE_ENV: test
          TOTEMDIGITAL_COMPACT: 'true'
        run: |
          npm test -- --testPathPattern="installationPolicy|installationRuntime|startup|publisher-billing.compact|financial-admin.issue-invoices|financialBillingWorker|billingIntervals|registerExtendedApiRoutes|invoiceService|financialAdmin.(publisher|revenueShare)|contract.validators"

      - name: Run frontend billingIntervals unit tests (Studio build profile)
        env:
          CI: true
        run: npm test --prefix frontend -- --watchAll=false --testPathPattern="billingIntervals|billingIssuePayload|issueInvoicesDialog|formatIssueInvoicesResult"

  validate-v6-studio:
    name: validate v6 schema (Studio seeds)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartsignage_validate
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps (validate-v6)
        run: npm ci --ignore-scripts

      - name: Apply schema v2 (ordered, fail on error)
        env:
          SKIP_CONFIRM: 'true'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: smartsignage_validate
          DB_USER: postgres
          PGPASSWORD: postgres
        working-directory: database
        run: ./apply-schema-v2.sh

      - name: Validate v6 seeds, Studio profile and financial columns
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: smartsignage_validate
          DB_USER: postgres
          DB_PASSWORD: postgres
          VALIDATE_V6_STRICT: 'true'
        run: node database/validate-v6.js

      - name: Validate financial schema columns (Studio billing)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: smartsignage_validate
          DB_USER: postgres
          PGPASSWORD: postgres
        run: ./scripts/validate-financial-schema.sh

      - name: Studio finance smoke SQL (read-only)
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: smartsignage_validate
          DB_USER: postgres
          PGPASSWORD: postgres
        run: ./scripts/validate-studio-finance-smoke.sh

