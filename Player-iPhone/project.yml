name: Player-iPhone
options:
  bundleIdPrefix: br.com.smartchannel
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: pt
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: App/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: br.com.smartchannel.playeriphone
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false
targets:
  Player-iPhone:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: Player-iPhone
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
schemes:
  Player-iPhone:
    build:
      targets:
        Player-iPhone: all
    run:
      config: Debug
    archive:
      config: Release
