<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDisplayFX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        #fx-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <canvas id="fx-canvas"></canvas>

    <!-- SmartDisplayFX Modules -->
    <script type="module">
        // Importar e expor globalmente
        import { mqttConfig, backendConfig } from './config.js';
        import { PlayerBridge, WebPlayerBridge } from './PlayerBridge.js';
        import { FxEngine } from './FxEngine.js';
        import { SmartDisplayFlowClient } from './SmartDisplayFlowClient.js';
        
        // Expor globalmente para comunicação com Android
        window.SmartDisplayFX = {
            SmartDisplayFlowClient,
            FxEngine,
            PlayerBridge,
            WebPlayerBridge,
            mqttConfig,
            backendConfig,
        };

        // Notificar Android que módulos foram carregados
        if (window.Android && window.Android.onSmartDisplayFXReady) {
            window.Android.onSmartDisplayFXReady();
        }
    </script>
</body>
</html>
