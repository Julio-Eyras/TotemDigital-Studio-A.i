<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Signage Player</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div id="app">
    <div id="player-container">
      <!-- Player de mídia será inserido aqui -->
    </div>
    <!-- Canvas para SmartDisplayFX (sobreposto ao player) -->
    <canvas id="fx-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000;"></canvas>
    <div id="status-bar" class="hidden">
      <span id="status-text">Carregando...</span>
    </div>
  </div>

  <!-- MQTT Client (para SmartDisplayFX) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- Scripts Core (copiados durante build) -->
  <script src="js/core/api/client.js"></script>
  <script src="js/core/playlist/manager.js"></script>
  <script src="js/core/heartbeat/service.js"></script>
  <script src="js/core/scheduler/scheduler.js"></script>
  <script src="js/core/utils/logger.js"></script>
  <script src="js/core/utils/cache.js"></script>
  <script src="js/core/utils/error-handler.js"></script>
  
  <!-- SmartDisplayFX - Carregar módulos e expor globalmente -->
  <script type="module">
    // Importar e expor globalmente para compatibilidade
    // Reutiliza módulos de shared/smartdisplayfx
    
    import { loadSiteConfig, createClientOptions, loadAndCreateClientOptions } from '../../shared/smartdisplayfx/config.js';
    import { SmartDisplayFlowClient } from '../../shared/smartdisplayfx/SmartDisplayFlowClient.js';
    import { FxEngine } from '../../shared/smartdisplayfx/FxEngine.js';
    import { PlayerBridge } from '../../shared/smartdisplayfx/PlayerBridge.js';
    
    // WebPlayerBridge para Electron (usa o mesmo padrão do webOS/Tizen)
    class WebPlayerBridge extends PlayerBridge {
      constructor(options = {}) {
        super(options);
        this.videoElement = options.videoElement || null;
        this._setupListeners();
      }
      
      _setupListeners() {
        if (!this.videoElement) return;
        
        this.videoElement.addEventListener('play', () => {
          this.currentPlaybackState = 'playing';
          this.onPlaybackStateChange?.('playing', this.currentPlaybackState);
        });
        
        this.videoElement.addEventListener('pause', () => {
          this.currentPlaybackState = 'paused';
          this.onPlaybackStateChange?.('paused', this.currentPlaybackState);
        });
        
        this.videoElement.addEventListener('ended', () => {
          this.currentPlaybackState = 'idle';
          this.onPlaybackStateChange?.('idle', this.currentPlaybackState);
        });
      }
      
      connect() {
        super.connect();
        this.log('WebPlayerBridge connected (Electron)');
      }
    }
    
    // Expor globalmente
    window.SmartDisplayFX = {
      SmartDisplayFlowClient,
      FxEngine,
      PlayerBridge,
      WebPlayerBridge,
      loadSiteConfig,
      createClientOptions,
      loadAndCreateClientOptions,
    };
  </script>
  
  <!-- Scripts Electron específicos -->
  <script src="src/js/player/media-player.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
