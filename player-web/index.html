<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Player - Debug/Desenvolvimento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
            color: #ff4444;
            text-align: center;
            padding: 20px;
        }
        #activation {
            display: none;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(25, 118, 210, 0.22), transparent 32%),
                radial-gradient(circle at bottom right, rgba(76, 175, 80, 0.18), transparent 28%),
                #050505;
        }
        .activation-card {
            width: min(460px, 100%);
            padding: 28px;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 18px;
            background: rgba(18,18,18,0.94);
            box-shadow: 0 18px 60px rgba(0,0,0,0.55);
        }
        .activation-card h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }
        .activation-card p {
            color: #bdbdbd;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        .activation-card label {
            display: block;
            margin: 16px 0 6px;
            font-size: 13px;
            color: #e0e0e0;
        }
        .activation-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.18);
            background: #111;
            color: #fff;
            font-size: 18px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .activation-card input.server-input {
            font-size: 14px;
            letter-spacing: 0;
            text-transform: none;
        }
        .activation-actions {
            display: flex;
            gap: 12px;
            margin-top: 22px;
        }
        .activation-card button {
            border: 0;
            border-radius: 10px;
            padding: 13px 16px;
            color: #fff;
            background: #1976d2;
            cursor: pointer;
            font-weight: 700;
            flex: 1;
        }
        .activation-card button.secondary {
            background: rgba(255,255,255,0.12);
        }
        .activation-card button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        #activation-message {
            min-height: 22px;
            margin-top: 14px;
            color: #90caf9;
            font-size: 14px;
        }
        #activation-message.error { color: #ff8a80; }
        #activation-message.success { color: #81c784; }
        #player-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #player-container video, #player-container img, #player-container iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #debug-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-height: 300px;
            min-height: 100px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 10px;
            overflow-y: auto;
            font-size: 11px;
            font-family: monospace;
            line-height: 1.4;
            border-top: 2px solid #0f0;
            z-index: 10000;
            display: none;
        }
        #debug-panel:empty::before {
            content: "Painel de debug ativado. Os logs aparecerão aqui quando houver atividade.";
            color: #666;
            font-style: italic;
            display: block;
            padding: 10px;
        }
        #debug-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10001;
            font-size: 12px;
            transition: bottom 0.3s ease;
        }
        #debug-controls {
            position: fixed;
            bottom: 10px;
            right: 90px;
            display: none;
            gap: 8px;
            z-index: 10001;
        }
        #debug-controls button {
            background: rgba(0,0,0,0.8);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        #debug-controls button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .log-entry {
            margin: 2px 0;
            padding: 3px;
            border-left: 2px solid #0f0;
            padding-left: 8px;
        }
        .log-request { border-color: #00f; color: #00f; }
        .log-response { border-color: #0f0; color: #0f0; }
        .log-error { border-color: #f00; color: #f00; }
        .log-info { border-color: #ff0; color: #ff0; }
        .timestamp { color: #666; font-size: 9px; }
        pre { margin: 2px 0; white-space: pre-wrap; word-wrap: break-word; font-size: 10px; }
        .cache-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Carregando player (modo debug)...</p>
        <p style="margin-top:10px;font-size:12px;color:#888;">Use ?uin=SEU_UIN&server=http://IP:PORTA para configurar servidor</p>
    </div>
    <div id="error">
        <h2>Erro ao Carregar Player</h2>
        <p id="error-message"></p>
        <p style="margin-top:20px;font-size:14px;color:#888;">Use ?uin=SEU_UIN na URL</p>
    </div>
    <div id="activation">
        <form id="activation-form" class="activation-card">
            <h1>Ativar esta tela</h1>
            <p>Digite o código de ativação exibido no painel de Totens para vincular este player à tela correta.</p>
            <label for="activation-code">Código de ativação</label>
            <input id="activation-code" name="activation-code" placeholder="TD-XXXX-XXXX" autocomplete="off" inputmode="text" />
            <label for="activation-server">Servidor</label>
            <input id="activation-server" class="server-input" name="activation-server" placeholder="http://IP:PORTA" />
            <div class="activation-actions">
                <button id="activation-submit" type="submit">Ativar tela</button>
                <button id="activation-reset" class="secondary" type="button">Limpar</button>
            </div>
            <div id="activation-message"></div>
        </form>
    </div>
    <div id="player-container">
        <div class="cache-info" id="cache-info" style="display:none;">Cache: <span id="cache-size">0 MB</span></div>
    </div>
    <div id="debug-panel"></div>
    <div id="debug-controls">
        <button id="btn-debug-validate" disabled>Validar Totem</button>
        <button id="btn-debug-heartbeat" disabled>Enviar Heartbeat</button>
        <button id="btn-debug-dispatch" disabled>Solicitar Playlist</button>
    </div>
    <button id="debug-toggle" onclick="toggleDebug()">🔍 Debug</button>

    <!-- Carregar scripts na ordem correta -->
    <!-- Usar caminhos relativos que funcionam independente do protocolo -->
    <script>
        (function () {
            var protocol = window.location.protocol;
            var host = window.location.host;
            var baseUrl = protocol + '//' + host;
            var scripts = [
                baseUrl + '/api/player-static/js/protocol/player-protocol.js',
                baseUrl + '/api/player-static/js/activationCode.js',
                baseUrl + '/api/player-static/js/cache/MediaCacheManager.js',
                baseUrl + '/api/player-static/js/cache/PlaylistChangeDetector.js',
                baseUrl + '/api/player-static/js/api/client.js',
                baseUrl + '/api/player-static/js/app.js'
            ];

            function loadScript(i) {
                if (i >= scripts.length) {
                    window.dispatchEvent(new CustomEvent('totem-player-static-ready'));
                    return;
                }
                var script = document.createElement('script');
                script.src = scripts[i];
                script.onload = function () {
                    loadScript(i + 1);
                };
                script.onerror = function () {
                    console.error('[Player] Erro ao carregar script:', scripts[i]);
                    loadScript(i + 1);
                };
                document.head.appendChild(script);
            }
            loadScript(0);
        })();
    </script>
    <script>
        window.addEventListener('totem-player-static-ready', function initTotemPlayerPage() {
        (function() {
            const debugPanel = document.getElementById('debug-panel');
            const debugControls = document.getElementById('debug-controls');
            const btnValidate = document.getElementById('btn-debug-validate');
            const btnHeartbeat = document.getElementById('btn-debug-heartbeat');
            const btnDispatch = document.getElementById('btn-debug-dispatch');

            let debugEnabled = false;
            let currentUin = null;
            let debugToken = null;
            let debugUin = null;
            let debugApiClient = null;

            // Configuração do servidor (Opção 2: URL Parameters)
            function getServerConfig() {
                const params = new URLSearchParams(window.location.search);
                const serverFromUrl = params.get('server') || params.get('api') || params.get('apiBase');

                // Prioridade 1: Parâmetro na URL
                if (serverFromUrl) {
                    const serverUrl = serverFromUrl.replace(/\/$/, ''); // Remove trailing slash
                    // Salvar em localStorage para próximas vezes
                    try {
                        localStorage.setItem('smartsignage_server_url', serverUrl);
                        console.log('[Config] Servidor configurado via URL:', serverUrl);
                    } catch (e) {
                        console.warn('[Config] Erro ao salvar config:', e);
                    }
                    return serverUrl;
                }

                // Prioridade 2: Configuração salva (localStorage)
                try {
                    const savedServer = localStorage.getItem('smartsignage_server_url');
                    if (savedServer) {
                        console.log('[Config] Usando servidor salvo:', savedServer);
                        return savedServer;
                    }
                } catch (e) {
                    console.warn('[Config] Erro ao ler config salva:', e);
                }

                // Prioridade 3: Fallback (window.location.origin)
                const fallback = window.location.origin;
                console.log('[Config] Usando fallback (window.location.origin):', fallback);
                return fallback;
            }

            const API_BASE = getServerConfig();

            function updateDebugControls() {
                if (!debugControls) return;
                debugControls.style.display = debugEnabled ? 'flex' : 'none';

                const canValidate =
                    debugEnabled &&
                    !!currentUin;

                const canSend =
                    debugEnabled &&
                    !!debugToken &&
                    !!debugUin &&
                    !!debugApiClient;

                if (btnValidate) btnValidate.disabled = !canValidate;
                if (btnHeartbeat) btnHeartbeat.disabled = !canSend;
                if (btnDispatch) btnDispatch.disabled = !canSend;
            }

            function toggleDebug() {
                debugEnabled = !debugEnabled;
                debugPanel.style.display = debugEnabled ? 'block' : 'none';
                const toggleBtn = document.getElementById('debug-toggle');
                toggleBtn.textContent = debugEnabled ? '✖ Fechar Debug' : '🔍 Debug';

                // Ajustar posição do botão quando o painel está aberto
                if (debugEnabled) {
                    toggleBtn.style.bottom = '320px';

                    // Limpar mensagem placeholder se existir
                    const placeholder = debugPanel.querySelector('.debug-placeholder');
                    if (placeholder) placeholder.remove();

                    // Se não houver logs, adicionar mensagem de boas-vindas
                    if (debugPanel.children.length === 0) {
                        const welcomeMsg = document.createElement('div');
                        welcomeMsg.className = 'log-entry log-info debug-placeholder';
                        welcomeMsg.innerHTML = '<span class="timestamp">[' + new Date().toLocaleTimeString() + ']</span> <strong>Painel de debug ativado.</strong> Os logs aparecerão aqui quando houver atividade do player.';
                        debugPanel.appendChild(welcomeMsg);
                    }
                } else {
                    toggleBtn.style.bottom = '10px';
                }

                updateDebugControls();
            }
            window.toggleDebug = toggleDebug;

            function log(type, message, data = null) {
                if (!debugEnabled) return;

                const timestamp = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;

                let content = `<span class="timestamp">[${timestamp}]</span> ${message}`;
                if (data) {
                    content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }

                entry.innerHTML = content;
                debugPanel.appendChild(entry);
                debugPanel.scrollTop = debugPanel.scrollHeight;

                // Também logar no console
                console.log(`[${type.toUpperCase()}]`, message, data || '');
            }

            function showError(msg) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('activation').style.display = 'none';
                document.getElementById('player-container').style.display = 'none';
                const el = document.getElementById('error');
                el.style.display = 'flex';
                const m = document.getElementById('error-message');
                if (m) m.textContent = msg || 'Erro desconhecido';
            }

            function hideLoadingShowPlayer() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('activation').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('player-container').style.display = 'block';
            }

            function showActivation(message, type) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('player-container').style.display = 'none';
                document.getElementById('activation').style.display = 'flex';

                const serverInput = document.getElementById('activation-server');
                if (serverInput && !serverInput.value) {
                    serverInput.value = API_BASE;
                }

                const messageEl = document.getElementById('activation-message');
                if (messageEl) {
                    messageEl.textContent = message || '';
                    messageEl.className = type || '';
                }
            }

            function getUin() {
                const params = new URLSearchParams(window.location.search);
                const fromUrl = params.get('uin') || params.get('UIN') || '';
                if (fromUrl) {
                    const norm = normalizeActivationCode(fromUrl);
                    saveActivationUin(norm);
                    return norm;
                }
                try {
                    const stored = localStorage.getItem('smartsignage_totem_uin') || '';
                    return stored ? normalizeActivationCode(stored) : '';
                } catch (e) {
                    return '';
                }
            }

            function saveActivationUin(uin) {
                try {
                    localStorage.setItem('smartsignage_totem_uin', normalizeActivationCode(uin));
                } catch (e) {
                    console.warn('[Activation] Erro ao salvar UIN:', e);
                }
            }

            function clearActivationData() {
                try {
                    localStorage.removeItem('smartsignage_totem_uin');
                    localStorage.removeItem('smartsignage_player_token');
                } catch (e) {}
            }

            function normalizeActivationCode(value) {
                if (typeof window.normalizeTotemUin === 'function') {
                    return window.normalizeTotemUin(value);
                }
                const normalized = String(value || '')
                    .trim()
                    .toUpperCase()
                    .replace(/[–—]/g, '-')
                    .replace(/\s+/g, '');
                const compact = normalized.replace(/-/g, '');
                if (/^TD[A-Z0-9]{8}$/.test(compact)) {
                    return `TD-${compact.slice(2, 6)}-${compact.slice(6, 10)}`;
                }
                return normalized;
            }

            function getOrCreateDeviceId() {
                try {
                    const saved = localStorage.getItem('smartsignage_device_id');
                    if (saved) {
                        const normalized = String(saved).trim().toUpperCase();
                        localStorage.setItem('smartsignage_device_id', normalized);
                        return normalized;
                    }
                } catch (e) {}

                const seed = [
                    navigator.userAgent,
                    navigator.language,
                    screen.width + 'x' + screen.height,
                    new Date().getTimezoneOffset(),
                    Math.random().toString(36)
                ].join('|');

                let hash = 0;
                for (let i = 0; i < seed.length; i++) {
                    hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                    hash = hash & hash;
                }
                const deviceId = ('browser-player-' + Math.abs(hash).toString(16)).toUpperCase();
                try {
                    localStorage.setItem('smartsignage_device_id', deviceId);
                } catch (e) {}
                return deviceId;
            }

            function collectHardwareInfo() {
                return {
                    deviceId: getOrCreateDeviceId(),
                    hostname: window.location.hostname || 'player-web',
                    platform: 'browser',
                    arch: navigator.platform || '',
                    userAgent: navigator.userAgent || '',
                    hardwareHash: getOrCreateDeviceId()
                };
            }

            async function registerActivationCode(uin) {
                const response = await fetch(API_BASE + '/api/player/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uin,
                        hardware: collectHardwareInfo()
                    })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.message || data.error || `HTTP ${response.status}`);
                }
                if (data.token) {
                    try {
                        localStorage.setItem('smartsignage_player_token', data.token);
                    } catch (e) {}
                }
                return data;
            }

            // Interceptar requisições do APIClient para logar
            const originalRequest = window.APIClient?.prototype?.request;
            if (originalRequest) {
                window.APIClient.prototype.request = async function(endpoint, method = 'GET', data = null) {
                    const startTime = Date.now();
                    log('request', `→ ${method} ${endpoint}`, data);

                    try {
                        const result = await originalRequest.call(this, endpoint, method, data);
                        const duration = Date.now() - startTime;
                        log('response', `← ${method} ${endpoint} (${duration}ms)`, result);
                        return result;
                    } catch (error) {
                        const duration = Date.now() - startTime;
                        log('error', `✗ ${method} ${endpoint} (${duration}ms): ${error.message}`, error);
                        throw error;
                    }
                };
            }

            async function validateTotem(uin) {
                try {
                    log('info', 'Validando totem...');
                    const tr = await fetch(API_BASE + '/api/player/token?uin=' + encodeURIComponent(uin));
                    if (!tr.ok) {
                        log('error', 'Erro ao obter token');
                        return { valid: false, error: 'Token falhou' };
                    }
                    const td = await tr.json();
                    const token = td.token;
                    if (!token) {
                        log('error', 'Token vazio');
                        return { valid: false, error: 'Token vazio' };
                    }

                    const vr = await fetch(API_BASE + '/api/player/validate?uin=' + encodeURIComponent(uin) + '&token=' + encodeURIComponent(token));
                    if (!vr.ok) {
                        const vd = await vr.json().catch(() => ({}));
                        log('error', `Validação falhou: ${vd.error || vd.reason || 'Erro desconhecido'}`);
                        return {
                            valid: false,
                            pendingApproval: !!vd.pendingApproval,
                            blocked: !!vd.blocked,
                            reason: vd.reason || vd.error,
                            message: vd.message
                        };
                    }
                    const vd = await vr.json();
                    if (vd.pending_approval || vd.pendingApproval) {
                        log('info', 'Totem aguardando aprovação');
                        return { valid: false, pendingApproval: true, blocked: false, message: vd.message || 'Aguardando aprovação' };
                    }
                    if (vd.blocked) {
                        log('error', `Totem bloqueado: ${vd.reason || vd.error}`);
                        return { valid: false, pendingApproval: false, blocked: true, reason: vd.reason || vd.error };
                    }
                    log('info', 'Totem válido e ativo');

                    // Configurar estado de debug (token, UIN e APIClient)
                    debugToken = token;
                    debugUin = uin;
                    try {
                        if (window.APIClient) {
                            debugApiClient = new window.APIClient(API_BASE, debugUin, '');
                            debugApiClient.token = debugToken;
                            debugApiClient.deviceId = String(
                                debugApiClient.deviceId || 'debug-web-player'
                            ).trim().toUpperCase();
                            log('info', 'APIClient de debug inicializado', {
                                baseURL: API_BASE,
                                uin: debugUin,
                                deviceId: debugApiClient.deviceId
                            });
                        } else {
                            log('error', 'APIClient não encontrado no contexto global. Verifique se js/api/client.js foi carregado.');
                        }
                    } catch (e) {
                        log('error', 'Erro ao inicializar APIClient de debug: ' + e.message, e);
                    }
                    updateDebugControls();

                    return { valid: true, pendingApproval: false, blocked: false };
                } catch (e) {
                    log('error', `Erro ao validar: ${e.message}`, e);
                    return { valid: false, pendingApproval: false, blocked: false, error: e.message };
                }
            }

            async function validateTotemDebug() {
                if (!debugEnabled) {
                    log('error', 'Debug não está habilitado.');
                    return;
                }
                if (!currentUin) {
                    log('error', 'UIN não encontrado para validação de debug.');
                    return;
                }
                log('info', 'Forçando validação de totem via botão Debug...');
                await validateTotem(currentUin);
            }

            async function sendDebugHeartbeat() {
                if (!debugEnabled) {
                    log('error', 'Debug não está habilitado.');
                    return;
                }
                if (!debugApiClient || !debugToken || !debugUin) {
                    log('error', 'APIClient de debug não está pronto. Valide o totem primeiro.');
                    return;
                }
                try {
                    log('info', 'Enviando heartbeat de debug...');
                    const response = await debugApiClient.sendHeartbeat({
                        uin: debugUin,
                        token: debugToken,
                        deviceId: debugApiClient.deviceId,
                        status: 'online',
                        platform: 'debug-web',
                        version: 'debug',
                        firmwareVersion: 'debug',
                        metrics: {}
                    });
                    log('info', 'Heartbeat de debug enviado com sucesso.', response);
                } catch (e) {
                    log('error', 'Erro ao enviar heartbeat de debug: ' + e.message, e);
                }
            }

            async function requestDebugDispatchPlan() {
                if (!debugEnabled) {
                    log('error', 'Debug não está habilitado.');
                    return;
                }
                if (!debugApiClient || !debugToken || !debugUin) {
                    log('error', 'APIClient de debug não está pronto. Valide o totem primeiro.');
                    return;
                }
                try {
                    log('info', 'Solicitando DispatchPlan de debug...');
                    const timestamp = new Date().toISOString();
                    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    const response = await debugApiClient.getDispatchPlan(
                        debugUin,
                        debugToken,
                        debugApiClient.deviceId,
                        timestamp,
                        timezone
                    );
                    log('info', 'DispatchPlan de debug recebido.', response);
                    if (response && response.plan && response.plan.metadata && response.plan.metadata.noCandidatesReason) {
                        log('warn', '⚠️ Playlist vazia: ' + response.plan.metadata.noCandidatesReason);
                        if (response.plan.metadata.diagnosticsUrl) {
                            log('info', 'Diagnóstico: GET ' + API_BASE + response.plan.metadata.diagnosticsUrl);
                        }
                    }
                } catch (e) {
                    log('error', 'Erro ao solicitar DispatchPlan de debug: ' + e.message, e);
                }
            }

            async function updateCacheInfo(player) {
                if (!player || !player.mediaCacheManager) return;
                try {
                    const size = await player.mediaCacheManager.getCacheSize();
                    const sizeMB = (size / (1024 * 1024)).toFixed(2);
                    const infoEl = document.getElementById('cache-info');
                    const sizeEl = document.getElementById('cache-size');
                    if (infoEl && sizeEl) {
                        sizeEl.textContent = sizeMB + ' MB';
                        infoEl.style.display = 'block';
                    }
                } catch (e) {
                    console.warn('[Bootstrap] Erro ao atualizar info de cache:', e);
                }
            }

            async function startPlayerWithUin(uin) {
                log('info', `UIN: ${uin}`);
                console.log('[Player] UIN:', uin);
                currentUin = uin;

                // Validar totem (simplificado - apenas verificar se existe e está ativo)
                const validation = await validateTotem(uin);
                if (!validation.valid) {
                    if (validation.pendingApproval) {
                        showActivation('Hardware vinculado. Aguarde aprovação do administrador no painel.', 'success');
                    } else if (validation.blocked) {
                        showError(`Totem bloqueado: ${validation.reason || 'Acesso bloqueado'}`);
                    } else {
                        clearActivationData();
                        showActivation(`Código não validado: ${validation.error || validation.reason || 'verifique o código no painel.'}`, 'error');
                    }
                    return;
                }

                hideLoadingShowPlayer();
                updateDebugControls();

                // 3. Configurar variáveis globais para o player
                window.API_BASE_URL = API_BASE;
                window.TOTEM_UIN = uin;
                window.TOTEM_SECRET = '';

                log('info', 'Inicializando SmartSignagePlayer...');

                // Verificar se SmartSignagePlayer está disponível
                if (typeof window.SmartSignagePlayer === 'undefined') {
                    showError('Erro: SmartSignagePlayer não foi carregado. Verifique se todos os scripts foram carregados corretamente.');
                    return;
                }

                // 4. Criar e inicializar player
                const player = new window.SmartSignagePlayer({
                    apiBaseURL: API_BASE,
                    totemUIN: uin,
                    totemSecret: '',
                    maxCacheSize: 500 * 1024 * 1024 // 500MB
                });

                // Adicionar logs nos eventos do player
                player.onInitialized = () => {
                    log('info', 'Player inicializado');
                };

                player.onDispatchPlanLoaded = (plan) => {
                    log('info', `Dispatch plan carregado: ${plan.mediaItems?.length || 0} itens`, {
                        playlistId: plan.playlistId,
                        campaignId: plan.campaignId,
                        mediaCount: plan.mediaItems?.length
                    });
                };

                player.onPlaying = (mediaItem) => {
                    log('info', `Reproduzindo: ${mediaItem.mediaId}`, {
                        type: mediaItem.type,
                        duration: mediaItem.duration
                    });
                };

                player.onPlaybackError = (err) => {
                    const msg = (err && err.message) || (err && err.type) || (err && String(err)) || 'Erro desconhecido';
                    log('error', `Erro na reprodução: ${msg}`, err);
                };

                try {
                    await player.init();

                    // Atualizar info de cache periodicamente
                    setInterval(() => updateCacheInfo(player), 10000);
                    updateCacheInfo(player);

                    await player.playNext();

                    log('info', '=== Player iniciado com sucesso ===');
                } catch (err) {
                    console.error('[Player] Erro:', err);
                    log('error', `Erro ao iniciar player: ${err.message}`, err);
                    showError('Erro ao iniciar player: ' + (err && err.message));
                }
            }

            async function main() {
                log('info', '=== Smart Signage Player - Debug Mode ===');
                log('info', `Servidor configurado: ${API_BASE}`);
                console.log('[Player] Servidor:', API_BASE);

                // Mostrar info de configuração na tela
                const loadingEl = document.getElementById('loading');
                if (loadingEl) {
                    const infoP = document.createElement('p');
                    infoP.style.marginTop = '10px';
                    infoP.style.fontSize = '12px';
                    infoP.style.color = '#888';
                    infoP.textContent = `Servidor: ${API_BASE}`;
                    loadingEl.appendChild(infoP);
                }

                const uin = getUin();
                if (!uin) {
                    showActivation('Informe o código de ativação para iniciar esta tela.', '');
                    log('info', 'Aguardando código de ativação');
                    return;
                }

                const params = new URLSearchParams(window.location.search);
                if (params.get('register') === '1') {
                    showActivation('Registrando hardware no servidor...', '');
                    const result = await registerActivationCode(uin);
                    saveActivationUin(uin);
                    if (result.status === 'pending_approval') {
                        showActivation('Hardware vinculado. Aguarde aprovação do administrador no painel.', 'success');
                        return;
                    }
                }

                await startPlayerWithUin(uin);
            }
            // Associar botões de debug às funções
            if (btnValidate) {
                btnValidate.addEventListener('click', () => {
                    validateTotemDebug().catch(err => {
                        console.error('[Debug] Erro ao validar totem:', err);
                    });
                });
            }

            if (btnHeartbeat) {
                btnHeartbeat.addEventListener('click', () => {
                    sendDebugHeartbeat().catch(err => {
                        console.error('[Debug] Erro ao enviar heartbeat:', err);
                    });
                });
            }

            if (btnDispatch) {
                btnDispatch.addEventListener('click', () => {
                    requestDebugDispatchPlan().catch(err => {
                        console.error('[Debug] Erro ao solicitar DispatchPlan:', err);
                    });
                });
            }

            const activationForm = document.getElementById('activation-form');
            const activationCodeInput = document.getElementById('activation-code');
            const activationServerInput = document.getElementById('activation-server');
            const activationSubmit = document.getElementById('activation-submit');
            const activationReset = document.getElementById('activation-reset');

            if (activationCodeInput) {
                activationCodeInput.addEventListener('input', () => {
                    activationCodeInput.value = normalizeActivationCode(activationCodeInput.value);
                });
            }

            if (activationReset) {
                activationReset.addEventListener('click', () => {
                    clearActivationData();
                    if (activationCodeInput) activationCodeInput.value = '';
                    showActivation('Dados locais limpos. Digite o código para ativar novamente.', '');
                });
            }

            if (activationForm) {
                activationForm.addEventListener('submit', async (event) => {
                    event.preventDefault();
                    const code = normalizeActivationCode(activationCodeInput && activationCodeInput.value);
                    const server = String(activationServerInput && activationServerInput.value || '').trim().replace(/\/$/, '');

                    if (!code) {
                        showActivation('Digite o código de ativação exibido no painel.', 'error');
                        return;
                    }

                    if (server && server !== API_BASE) {
                        try {
                            localStorage.setItem('smartsignage_server_url', server);
                        } catch (e) {}
                        const nextUrl = new URL(window.location.href);
                        nextUrl.searchParams.set('server', server);
                        nextUrl.searchParams.set('uin', code);
                        nextUrl.searchParams.set('register', '1');
                        window.location.href = nextUrl.toString();
                        return;
                    }

                    try {
                        if (activationSubmit) {
                            activationSubmit.disabled = true;
                            activationSubmit.textContent = 'Ativando...';
                        }
                        showActivation('Registrando hardware no servidor...', '');
                        const result = await registerActivationCode(code);
                        saveActivationUin(code);

                        if (result.status === 'pending_approval') {
                            showActivation('Hardware vinculado. Aguarde aprovação do administrador no painel.', 'success');
                            return;
                        }

                        document.getElementById('activation').style.display = 'none';
                        document.getElementById('loading').style.display = 'flex';
                        await startPlayerWithUin(code);
                    } catch (e) {
                        clearActivationData();
                        showActivation('Erro ao ativar: ' + (e && e.message ? e.message : 'verifique o código e o servidor.'), 'error');
                    } finally {
                        if (activationSubmit) {
                            activationSubmit.disabled = false;
                            activationSubmit.textContent = 'Ativar tela';
                        }
                    }
                });
            }

            // Inicializar quando a página carregar
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', main);
            } else {
                main();
            }
        })();
        }, { once: true });
    </script>
</body>
</html>
