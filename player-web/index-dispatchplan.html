<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Player - Web (DispatchPlan)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 1000;
        }
        
        #status.error {
            background: rgba(255, 0, 0, 0.7);
        }
        
        #status.loading {
            background: rgba(0, 0, 255, 0.7);
        }
        
        video, img, iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="status" class="loading">Carregando...</div>
    <div id="player-container"></div>
    
    <script>
        // Configuração (pode ser passada via URL ou variáveis de ambiente)
        window.API_BASE_URL = window.API_BASE_URL || 'http://localhost:3000';
        window.TOTEM_UIN = window.TOTEM_UIN || '';
        window.TOTEM_SECRET = window.TOTEM_SECRET || '';
    </script>
    
    <script src="js/api/client.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Inicializar player quando página carregar
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');
            
            // Obter configuração da URL
            const urlParams = new URLSearchParams(window.location.search);
            const apiBaseURL = urlParams.get('api') || window.API_BASE_URL;
            const totemUIN = urlParams.get('uin') || window.TOTEM_UIN;
            const totemSecret = urlParams.get('secret') || window.TOTEM_SECRET;
            
            const player = new SmartSignagePlayer({
                apiBaseURL: apiBaseURL,
                totemUIN: totemUIN,
                totemSecret: totemSecret
            });
            
            // Event handlers
            player.onInitialized = () => {
                statusEl.textContent = 'Inicializado';
                statusEl.className = '';
            };
            
            player.onDispatchPlanLoaded = (dispatchPlan) => {
                statusEl.textContent = `Carregado: ${dispatchPlan.playlistName}`;
                statusEl.className = '';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            };
            
            player.onPlaying = (mediaItem) => {
                statusEl.textContent = `Reproduzindo: ${mediaItem.metadata?.name || `Item ${mediaItem.mediaId}`}`;
                statusEl.className = '';
                statusEl.style.display = 'block';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 2000);
            };
            
            player.onError = (error) => {
                statusEl.textContent = `Erro: ${error.message}`;
                statusEl.className = 'error';
            };
            
            player.onPlaybackError = (error) => {
                statusEl.textContent = `Erro na reprodução: ${error.message}`;
                statusEl.className = 'error';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            };
            
            // Inicializar
            player.init()
                .then(() => {
                    player.playNext();
                })
                .catch(error => {
                    console.error('Erro na inicialização:', error);
                    statusEl.textContent = `Erro: ${error.message}`;
                    statusEl.className = 'error';
                });
        });
    </script>
</body>
</html>
