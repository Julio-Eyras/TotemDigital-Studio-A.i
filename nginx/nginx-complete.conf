# Smart Signage Pro v2.0 - Configuração Nginx Completa (Frontend + Proxy)
# Este arquivo serve arquivos estáticos do frontend E faz proxy para o backend
#
# SEGURANÇA: 
# - Processo master inicia como root (necessário para bind na porta 80)
# - Workers rodam como usuário 'nginx' (não-privilegiado) - configurado abaixo
# - Isso é padrão e seguro em containers Docker

# Configuração principal do Nginx
# IMPORTANTE: Workers rodam como 'nginx', não como root
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuração de buffers no contexto http
    large_client_header_buffers 8 64k;
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 32k;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Buffer sizes para proxy
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Server block principal
    server {
        # Porta do Nginx parametrizável via envsubst (NGINX_PORT)
        listen ${NGINX_PORT} default_server;
        listen [::]:${NGINX_PORT} default_server;
        server_name _;

        # Root para arquivos estáticos do frontend
        root /usr/share/nginx/html;
        index index.html;

        # Configurações de buffer no nível do servidor
        # Aumentado para suportar uploads de mídia maiores (vídeos, etc)
        client_max_body_size 500M;
        client_body_buffer_size 512k;

        # Endpoint de métricas para Prometheus
        location /metrics {
            return 200 "";
            add_header Content-Type text/plain;
        }

        # Proxy para API do backend (DEVE VIR ANTES DE /)
        location /api/ {
            proxy_pass http://backend:${BACKEND_INTERNAL_PORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Buffers específicos para API
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Assets/Uploads (servidos pelo backend)
        location /assets/ {
            proxy_pass http://backend:${BACKEND_INTERNAL_PORT};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /uploads/ {
            proxy_pass http://backend:${BACKEND_INTERNAL_PORT};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Player route com buffers maiores (DEVE VIR ANTES DE /)
        location /player {
            proxy_pass http://backend:${BACKEND_INTERNAL_PORT};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # Buffers maiores para player
            proxy_buffer_size 256k;
            proxy_buffers 8 512k;
            proxy_busy_buffers_size 512k;
            proxy_temp_file_write_size 512k;
        }

        # Arquivos estáticos com cache longo (DEVE VIR ANTES DO /)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Frontend React (SPA) - DEVE VIR POR ÚLTIMO
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            
            # Primeiro tenta servir arquivo estático, depois index.html
            try_files $uri $uri/ /index.html;
            
            # Headers para evitar cache do index.html
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
