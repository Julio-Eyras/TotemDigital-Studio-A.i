# Smart Signage Pro v2.0 - Configuração Nginx (Container Nginx Principal)
# NOTA: large_client_header_buffers deve estar no contexto http (nginx.conf principal)
# Não pode estar no contexto server, então removido daqui

# Server block PRINCIPAL - deve ser o único ativo
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # IMPORTANTE: NÃO definir root - usar apenas proxy_pass
    # Isso garante que NUNCA servirá arquivos locais/padrão
    # Se o proxy falhar, retornar 502 customizado ao invés de mostrar página padrão
    
    # Aumentar buffers para evitar erro 400 (apenas as diretivas permitidas no contexto server)
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    # large_client_header_buffers NÃO pode estar aqui - deve estar no contexto http

    # Endpoint de métricas para Prometheus
    location /metrics {
        return 200 "";
        add_header Content-Type text/plain;
    }

    # Proxy para API do backend (DEVE VIR ANTES DE /)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Buffers específicos para API
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Player route com buffers maiores (DEVE VIR ANTES DE /)
    location /player {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Buffers maiores para player
        proxy_buffer_size 256k;
        proxy_buffers 8 512k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
        # large_client_header_buffers NÃO pode estar no contexto location
    }

    # Proxy para todas as requisições do frontend (DEVE VIR POR ÚLTIMO)
    location / {
        # Aguardar até 30s para o frontend estar pronto
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Tentar proxy para frontend
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # IMPORTANTE: Interceptar erros para evitar página padrão
        proxy_intercept_errors on;
        
        # Buffers para frontend
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Se proxy falhar, retornar erro customizado (não página padrão)
        error_page 502 503 504 = @proxy_error;
        
        # Não tentar outros upstreams se falhar
        proxy_next_upstream off;
    }
    
    # Handler de erro customizado - retorna JSON ao invés de HTML padrão
    location @proxy_error {
        default_type application/json;
        return 502 '{"error":"Servico temporariamente indisponivel","message":"O frontend nao esta respondendo. Verifique os logs dos containers."}';
    }

    # Arquivos estáticos com cache (também via proxy)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    gzip_disable "MSIE [1-6]\.";
}
