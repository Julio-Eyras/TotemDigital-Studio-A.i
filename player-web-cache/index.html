<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Player - Debug/Desenvolvimento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #0f0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        #debug-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            color: #0f0;
            padding: 20px;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.6;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #0f0;
            padding-left: 10px;
        }
        .log-request { border-color: #00f; color: #00f; }
        .log-response { border-color: #0f0; color: #0f0; }
        .log-error { border-color: #f00; color: #f00; }
        .log-info { border-color: #ff0; color: #ff0; }
        .timestamp { color: #666; font-size: 10px; }
        pre { margin: 5px 0; white-space: pre-wrap; word-wrap: break-word; }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border: 1px solid #0f0;
            border-radius: 4px;
            min-width: 200px;
        }
        #status.error { border-color: #f00; }
        #status.warning { border-color: #ff0; }
    </style>
</head>
<body>
    <div id="status">Status: Inicializando...</div>
    <div id="debug-panel"></div>

    <script>
        (function() {
            const API_BASE = window.location.origin;
            const debugPanel = document.getElementById('debug-panel');
            const statusEl = document.getElementById('status');
            
            let uin = null;
            let token = null;
            let heartbeatInterval = null;
            let dispatchInterval = null;

            function log(type, message, data = null) {
                const timestamp = new Date().toLocaleTimeString();
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                
                let content = `<span class="timestamp">[${timestamp}]</span> ${message}`;
                if (data) {
                    content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
                
                entry.innerHTML = content;
                debugPanel.appendChild(entry);
                debugPanel.scrollTop = debugPanel.scrollHeight;
                
                // Também logar no console
                console.log(`[${type.toUpperCase()}]`, message, data || '');
            }

            function updateStatus(message, type = 'info') {
                statusEl.textContent = `Status: ${message}`;
                statusEl.className = type;
            }

            function getUin() {
                const params = new URLSearchParams(window.location.search);
                return params.get('uin') || params.get('UIN') || '';
            }

            async function request(url, options = {}) {
                const startTime = Date.now();
                log('request', `→ ${options.method || 'GET'} ${url}`, options.body ? JSON.parse(options.body) : null);
                
                try {
                    const response = await fetch(url, {
                        ...options,
                        headers: {
                            'Content-Type': 'application/json',
                            ...options.headers
                        }
                    });
                    
                    const duration = Date.now() - startTime;
                    const data = await response.json().catch(() => ({}));
                    
                    log('response', `← ${response.status} ${response.statusText} (${duration}ms)`, data);
                    
                    return { ok: response.ok, status: response.status, data };
                } catch (error) {
                    log('error', `✗ Erro na requisição: ${error.message}`, error);
                    return { ok: false, error: error.message };
                }
            }

            async function getToken() {
                log('info', 'Obtendo token...');
                const result = await request(`${API_BASE}/api/player/token?uin=${encodeURIComponent(uin)}`);
                
                if (result.ok && result.data.token) {
                    token = result.data.token;
                    log('info', `Token obtido: ${token.substring(0, 20)}...`);
                    return true;
                }
                return false;
            }

            async function validateTotem() {
                log('info', 'Validando totem...');
                const result = await request(
                    `${API_BASE}/api/player/validate?uin=${encodeURIComponent(uin)}&token=${encodeURIComponent(token)}`
                );
                
                if (result.ok && result.data.valid) {
                    log('info', 'Totem válido e ativo');
                    return true;
                } else {
                    log('error', `Totem inválido: ${result.data.error || result.data.reason || 'Erro desconhecido'}`);
                    if (result.data.pendingApproval) {
                        updateStatus('Aguardando aprovação', 'warning');
                    } else if (result.data.blocked) {
                        updateStatus('Totem bloqueado', 'error');
                    }
                    return false;
                }
            }

            async function getDispatchPlan() {
                log('info', 'Solicitando dispatch plan...');
                const result = await request(
                    `${API_BASE}/api/player/dispatch?uin=${encodeURIComponent(uin)}&token=${encodeURIComponent(token)}`
                );
                
                if (result.ok && result.data.plan) {
                    const plan = result.data.plan;
                    log('info', `Dispatch plan recebido: ${plan.mediaItems?.length || 0} itens`);
                    log('info', `Playlist ID: ${plan.playlistId}, Campaign ID: ${plan.campaignId || 'N/A'}`);
                    return plan;
                } else {
                    log('error', `Erro ao obter dispatch plan: ${result.data.error || 'Erro desconhecido'}`);
                    return null;
                }
            }

            async function sendHeartbeat() {
                log('info', 'Enviando heartbeat...');
                const result = await request(`${API_BASE}/api/player/heartbeat?uin=${encodeURIComponent(uin)}&token=${encodeURIComponent(token)}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        status: 'online',
                        timestamp: Date.now()
                    })
                });
                
                if (result.ok) {
                    log('info', 'Heartbeat enviado com sucesso');
                    if (result.data.commands && result.data.commands.length > 0) {
                        log('info', `Comandos recebidos: ${result.data.commands.length}`, result.data.commands);
                    }
                } else {
                    log('error', `Erro no heartbeat: ${result.data.error || 'Erro desconhecido'}`);
                }
            }

            async function init() {
                log('info', '=== Smart Signage Player - Debug Mode ===');
                log('info', `API Base: ${API_BASE}`);
                
                // 1. Obter UIN do parâmetro
                uin = getUin();
                if (!uin) {
                    updateStatus('UIN não fornecido', 'error');
                    log('error', 'UIN não fornecido na URL. Use: ?uin=SEU_UIN');
                    return;
                }
                
                log('info', `UIN: ${uin}`);
                updateStatus(`UIN: ${uin}`, 'info');
                
                // 2. Obter token
                if (!await getToken()) {
                    updateStatus('Erro ao obter token', 'error');
                    return;
                }
                
                // 3. Validar totem
                if (!await validateTotem()) {
                    return;
                }
                
                updateStatus('Totem válido - Iniciando debug...', 'info');
                
                // 4. Obter dispatch plan inicial
                await getDispatchPlan();
                
                // 5. Iniciar heartbeat periódico (a cada 30s)
                heartbeatInterval = setInterval(() => {
                    sendHeartbeat();
                }, 30000);
                
                // 6. Atualizar dispatch plan periodicamente (a cada 5min)
                dispatchInterval = setInterval(async () => {
                    await getDispatchPlan();
                }, 300000);
                
                // Enviar primeiro heartbeat
                setTimeout(() => sendHeartbeat(), 2000);
                
                log('info', '=== Player de debug iniciado ===');
                log('info', '- Heartbeat a cada 30s');
                log('info', '- Atualização de dispatch a cada 5min');
            }

            // Inicializar quando a página carregar
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
