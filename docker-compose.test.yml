# Smart Signage Pro v2.0 - Docker Compose para Testes
# Ambiente virtual completo com arquitetura separada

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres-test
    environment:
      POSTGRES_DB: smartsignage_test
      POSTGRES_USER: smartsignage
      POSTGRES_PASSWORD: smartsignage123
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - smartsignage-test-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend-test
    environment:
      - DB_DRIVER=postgres
      - DATABASE_URL=postgresql://smartsignage:smartsignage123@postgres:5432/smartsignage_test
      - NODE_ENV=test
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=smartsignage-test-secret-key-2025
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - UPLOAD_PATH=/app/uploads
      - LOG_LEVEL=debug
      - LOG_FILE=/app/logs/app.log
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - backend_test_uploads:/app/uploads
      - backend_test_logs:/app/logs
      - backend_test_data:/app/data
    networks:
      - smartsignage-test-network

  # Frontend Admin Panel
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend-test
    ports:
      - "3001:80"
    depends_on:
      - backend
    volumes:
      - frontend_test_assets:/usr/share/nginx/html/assets
    networks:
      - smartsignage-test-network

volumes:
  # Database volumes
  postgres_test_data:
    driver: local
  
  # Backend volumes
  backend_test_uploads:
    driver: local
  backend_test_logs:
    driver: local
  backend_test_data:
    driver: local
  
  # Frontend volumes
  frontend_test_assets:
    driver: local

networks:
  smartsignage-test-network:
    driver: bridge
