buildscript {
    ext {
        kotlin_version = "1.9.24"
        agp_version = "8.3.2"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def playerReleaseDir = file("${rootDir}/../Player-AD/build/outputs/apk/release")
def bootDir = file("${rootDir}/../install-pendrive/bootanimation")
def bundledAssets = file("${buildDir}/bundled-assets")

tasks.register('bundlePlayerApk', Copy) {
    from {
        def versioned = (playerReleaseDir.listFiles() ?: []).findAll {
            it.name ==~ /Player-AD-Vs.+-build-.+\.apk/ && !it.name.contains('unsigned')
        }
        def kitDir = file("${rootDir}/../install-pendrive/apk")
        def kit = (kitDir.listFiles() ?: []).findAll {
            it.name ==~ /Player-AD-Vs.+-build-.+\.apk/
        }
        def apk = versioned ? versioned.toList().max { it.lastModified() }
            : kit ? kit.toList().max { it.lastModified() }
            : file("${playerReleaseDir}/Player-AD-release.apk")
        if (apk == null || !apk.exists()) {
            throw new GradleException(
                "Player-AD APK nao encontrado em ${playerReleaseDir} nem em ${kitDir}.\n" +
                    "Compile primeiro: cd Player-AD && .\\gradlew.bat assembleRelease\n" +
                    "Esperado: Player-AD-Vs*-build-*.apk"
            )
        }
        apk
    }
    into bundledAssets
    rename { 'player-ad.apk' }
}

tasks.register('bundleBootAssets', Copy) {
    from(bootDir) {
        include 'totemdigital.bmp'
        include 'totemdigital-portrait.bmp'
        include 'totemdigital-portrait-reverse.bmp'
        include 'totemdigital-landscape.bmp'
        include 'bootanimation.zip'
        include 'bootanimation-portrait.zip'
        include 'bootanimation-portrait-reverse.zip'
    }
    into bundledAssets
    rename { String name ->
        name == 'bootanimation.zip' ? 'bootanimation-landscape.zip' : name
    }
    doFirst {
        bundledAssets.mkdirs()
        def bmp = new File(bootDir, 'totemdigital-portrait.bmp')
        def reverseBmp = new File(bootDir, 'totemdigital-portrait-reverse.bmp')
        def landscapeBmp = new File(bootDir, 'totemdigital-landscape.bmp')
        def portrait = new File(bootDir, 'bootanimation-portrait.zip')
        def reverse = new File(bootDir, 'bootanimation-portrait-reverse.zip')
        if (!bmp.exists() || !reverseBmp.exists() || !landscapeBmp.exists() || !portrait.exists() || !reverse.exists()) {
            throw new GradleException(
                "Logos TotemDigital em falta em ${bootDir}.\n" +
                    "  python Player-AD/scripts/build-totemdigital-boot-assets.py"
            )
        }
    }
}

android {
    namespace 'br.com.smartchannel.instalaplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.smartchannel.instalaplayer'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.7'
        multiDexEnabled false
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main.assets.srcDirs += bundledAssets
    }
}

android.applicationVariants.configureEach { variant ->
    variant.outputs.configureEach { output ->
        def vName = variant.versionName
        def vCode = variant.versionCode
        output.outputFileName = "Instala-Player-TotemDigital-Vs${vName}-build-${vCode}.apk"
    }
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn('bundlePlayerApk', 'bundleBootAssets') }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

repositories {
    google()
    mavenCentral()
}
