# Smart Signage Pro v2.1 - Docker Compose (Arquitetura Separada)
# Arquitetura otimizada para produção e evolução
# Frontend, Backend e Workers em containers separados

version: '3.8'

services:
  # ============================================================================
  # INFRAESTRUTURA BASE
  # ============================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartsignage-postgres
    environment:
      POSTGRES_DB: smartsignage
      POSTGRES_USER: smartsignage
      POSTGRES_PASSWORD: smartsignage123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema-postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsignage -d smartsignage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartsignage-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache e Filas
  redis:
    image: redis:7-alpine
    container_name: smartsignage-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smartsignage-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # APLICAÇÃO (SEPARADA)
  # ============================================================================

  # Frontend (React + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartsignage-frontend
    expose:
      - "80"
    volumes:
      - frontend_static:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - smartsignage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Backend API (Node.js/Express)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartsignage-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_DRIVER=postgres
      - DATABASE_URL=postgresql://smartsignage:smartsignage123@postgres:5432/smartsignage
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PLAYER_ABANDON_PIN=${PLAYER_ABANDON_PIN:-1234}
      - AI_PROVIDER=ollama
      - AI_MODEL=llama3.2:3b
      - OLLAMA_BASE_URL=http://ollama:11434
      - UPLOAD_MAX_SIZE=100MB
      - UPLOAD_PATH=/app/uploads
      - MEDIA_QUOTA_PER_CLIENT=5GB
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/app.log
      - CORS_ORIGIN=http://localhost,http://frontend
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartsignage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Workers (Processamento Pesado - Bull Queue)
  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: smartsignage-workers
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://smartsignage:smartsignage123@postgres:5432/smartsignage
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/workers.log
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartsignage-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
      replicas: 1  # Pode escalar: docker compose up -d --scale workers=3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartsignage-nginx
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-reverse-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./player:/usr/share/nginx/html/player:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - smartsignage-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # SERVIÇOS AUXILIARES
  # ============================================================================

  # AI Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: smartsignage-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartsignage-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  # Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: smartsignage-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - smartsignage-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Monitoring (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: smartsignage-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3002
    ports:
      - "${GRAFANA_PORT:-3002}:3002"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/alerts:/etc/grafana/provisioning/alerting:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - smartsignage-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  # Database volumes
  postgres_data:
    driver: local
  
  # Backend volumes
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  backend_data:
    driver: local
  
  # Frontend volumes
  frontend_static:
    driver: local
  
  # AI Service volumes
  ollama_data:
    driver: local
  
  # Cache volumes
  redis_data:
    driver: local
  
  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================

networks:
  smartsignage-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

