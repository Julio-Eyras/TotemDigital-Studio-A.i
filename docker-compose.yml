services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smartsignage-postgres
    environment:
      POSTGRES_DB: smartsignage
      POSTGRES_USER: smartsignage
      POSTGRES_PASSWORD: smartsignage123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartsignage -d smartsignage"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartsignage-network

  # Backend API
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartsignage-backend
    environment:
      - DB_DRIVER=postgres
      - DATABASE_URL=postgresql://smartsignage:smartsignage123@postgres:5432/smartsignage
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PLAYER_ABANDON_PIN=${PLAYER_ABANDON_PIN:-1234}
      - AI_PROVIDER=ollama
      - AI_MODEL=llama3.2:3b
      - OLLAMA_BASE_URL=http://ollama:11434
      - UPLOAD_MAX_SIZE=100MB
      - UPLOAD_PATH=/app/uploads
      - MEDIA_QUOTA_PER_CLIENT=5GB
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/app.log
      - CORS_ORIGIN=http://frontend:80,http://nginx:80
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartsignage-network

  # Frontend Admin Panel
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartsignage-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - frontend_assets:/usr/share/nginx/html/assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartsignage-network

  # AI Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: smartsignage-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartsignage-network

  # Redis Cache (opcional)
  redis:
    image: redis:7-alpine
    container_name: smartsignage-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smartsignage-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smartsignage-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - smartsignage-network

  # Monitoring (Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: smartsignage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smartsignage-network

  # Monitoring (Grafana)
  grafana:
    image: grafana/grafana:latest
    container_name: smartsignage-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - smartsignage-network

volumes:
  # Database volumes
  postgres_data:
    driver: local
  
  # Backend volumes
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  backend_data:
    driver: local
  
  # Frontend volumes
  frontend_assets:
    driver: local
  
  # AI Service volumes
  ollama_data:
    driver: local
  
  # Cache volumes
  redis_data:
    driver: local
  
  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  smartsignage-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
