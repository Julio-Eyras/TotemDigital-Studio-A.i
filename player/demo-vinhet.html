<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Pro - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-size: 120px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: fadeInOut 3s ease-in-out infinite;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 48px;
            color: #90caf9;
            margin-bottom: 40px;
            animation: fadeInOut 3s ease-in-out infinite 0.5s;
        }

        .instructions {
            font-size: 32px;
            color: #b0bec5;
            text-align: center;
            max-width: 800px;
            margin-bottom: 60px;
            animation: fadeInOut 3s ease-in-out infinite 1s;
        }

        .version {
            font-size: 24px;
            color: #78909c;
            position: absolute;
            bottom: 40px;
            animation: fadeInOut 3s ease-in-out infinite 1.5s;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="logo pulse">Smart Signage Pro</div>
    <div class="subtitle">Modo Demonstração</div>
    <div class="instructions">
        Configure o UIN na URL:<br>
        <code style="background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 5px; display: inline-block; margin-top: 10px;">?uin=SEU_UIN</code>
    </div>
    <div class="version">v2.1.0</div>
</body>
</html>
