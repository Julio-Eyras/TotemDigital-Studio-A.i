<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Orientação controlada pelo sistema (xrandr). Sem rotação no CSS. */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
            color: #ff4444;
            text-align: center;
            padding: 20px;
        }
        
        #player-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #content {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Estilos para vídeos e imagens */
        #content video,
        #content img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Transições suaves */
        .media-item {
            position: absolute;
            top: 0;
            left: 0;
                width: 100%;
                height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        
        .media-item.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Carregando player...</p>
        </div>

    <div id="error">
        <h2>Erro ao Carregar Player</h2>
        <p id="error-message"></p>
        <p style="margin-top: 20px; font-size: 14px; color: #888;">Verifique se o UIN do totem foi fornecido corretamente.</p>
        </div>

    <div id="player-container">
        <div id="content"></div>
    </div>

    <script>
        class SmartSignagePlayer {
            constructor() {
                this.apiBaseUrl = window.location.origin + '/api';
                this.uin = new URLSearchParams(window.location.search).get('uin') || 
                          new URLSearchParams(window.location.search).get('UIN') || 
                          localStorage.getItem('totemUIN');
                this.token = null;
                this.totemData = null;
                this.playlist = null;
                this.currentMediaIndex = 0;
                this.mediaElements = [];
                this.pendingCommands = [];
                this.heartbeatInterval = null;
                this.playlistInterval = null;
                this.init();

                // PIN: 5 cliques com botão direito em 2s → solicitar PIN 1950
                this._rcCount = 0;
                this._rcTimer = null;
                window.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    this._rcCount++;
                    if (this._rcTimer) clearTimeout(this._rcTimer);
                    this._rcTimer = setTimeout(() => { this._rcCount = 0; }, 2000);
                    if (this._rcCount >= 5) {
                        this._rcCount = 0;
                        const pin = prompt('Digite o PIN (4 dígitos):');
                        if (pin === '1950') {
                            alert('PIN correto. Saindo do player e retornando ao ambiente gráfico...');
                            this.exitKioskMode();
                        } else if (pin !== null) {
                            alert('PIN incorreto.');
                        }
                    }
                });
            }

            async init() {
                try {
                    console.log('🚀 Iniciando Smart Signage Player v2.1...');
                    
                    // Tentar carregar UIN do arquivo de configuração encriptado
                    if (!this.uin) {
                        this.uin = await this.loadUinFromConfig();
                    }
                    
                    // Se ainda não tiver UIN, tentar da URL ou localStorage
                    if (!this.uin) {
                        this.uin = new URLSearchParams(window.location.search).get('uin') || 
                                  new URLSearchParams(window.location.search).get('UIN') || 
                                  localStorage.getItem('totemUIN');
                    }
                    
                    console.log('UIN atual:', this.uin);
                    
                    // Se não tiver UIN, entrar em modo demo local
                    if (!this.uin) {
                        console.log('🎬 UIN não encontrado. Iniciando modo demo local...');
                        this.startDemoMode();
                        return;
                    }

                    // Validar totem
                    if (!this.uin || this.uin.trim() === '') {
                        console.log('🎬 UIN vazio. Iniciando modo demo local...');
                        this.startDemoMode();
                        return;
                    }
                    
                    const validation = await this.validateTotem();
                    if (!validation.valid) {
                        if (validation.pendingApproval) {
                            // Totem aguardando aprovação
                            this.showPendingApprovalPage(validation.message || 'Aguardando aprovação do administrador');
                            return;
                        }
                        if (validation.blocked) {
                            this.showBlockedPage(validation.reason);
                            return;
                        }
                        // UIN inexistente: entrar em modo demo local
                        console.warn('⚠️ UIN não encontrado. Iniciando modo demo local...');
                        this.startDemoMode();
                        return;
                    }

                    console.log('✅ Totem validado:', this.totemData);
                    console.log('📋 Comandos pendentes:', this.pendingCommands.length);
                    console.log('🎬 Playlist:', this.playlist ? `${this.playlist.name} (${this.playlist.items?.length || 0} itens)` : 'Nenhuma playlist');

                    // Executar comandos pendentes
                    await this.executePendingCommands();

                    // Carregar e reproduzir playlist
                    if (this.playlist && this.playlist.items && this.playlist.items.length > 0) {
                        await this.loadPlaylist(this.playlist);
                        this.startPlayback();
                    } else {
                        // Tentar carregar demo caso não haja playlist
                        if (this.uin !== 'default-demo') {
                            console.warn('Sem playlist. Carregando demo...');
                            this.uin = 'default-demo';
                            const demoValidation2 = await this.validateTotem();
                            if (!demoValidation2.valid || !this.playlist || !this.playlist.items || this.playlist.items.length === 0) {
                                this.showError('Nenhuma playlist disponível e demo indisponível.');
                                return;
                            }
                        } else {
                            this.showError('Nenhuma playlist disponível para este totem.');
                            return;
                        }
                    }
                    
                    // Iniciar heartbeat
                    this.startHeartbeat();
                    
                    // Verificar atualizações de playlist periodicamente
                    this.startPlaylistCheck();
                    
                    console.log('✅ Player inicializado com sucesso');
                } catch (error) {
                    console.error('❌ Erro ao inicializar player:', error);
                    this.showError('Erro ao inicializar player: ' + error.message);
                }
            }
            
            async loadUinFromConfig() {
                try {
                    // Tentar carregar arquivo de configuração encriptado
                    const configResponse = await fetch('/player/config.json.enc');
                    if (!configResponse.ok) {
                        console.log('⚠️ Arquivo de configuração não encontrado. Usando UIN da URL ou fallback.');
                        return null;
                    }
                    
                    const config = await configResponse.json();
                    if (!config.encrypted || !config.data) {
                        console.warn('⚠️ Arquivo de configuração inválido.');
                        return null;
                    }
                    
                    // Obter MAC address atual (via API ou fallback)
                    const macAddress = await this.getMacAddress();
                    
                    // Enviar configuração encriptada para o backend para desencriptar e validar
                    const decryptResponse = await fetch(`${this.apiBaseUrl}/player/decrypt-config`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            encryptedConfig: config,
                            currentMac: macAddress
                        })
                    });
                    
                    if (!decryptResponse.ok) {
                        console.error('❌ Falha ao desencriptar configuração do player');
                        return null;
                    }
                    
                    const decryptData = await decryptResponse.json();
                    if (decryptData.valid && decryptData.uin) {
                        console.log('✅ UIN carregado do arquivo de configuração encriptado');
                        return decryptData.uin;
                    } else {
                        console.error('❌ Configuração do player inválida ou vinculada a outro hardware');
                        return null;
                    }
                } catch (error) {
                    console.error('❌ Erro ao carregar configuração do player:', error);
                    return null;
                }
            }
            
            async getMacAddress() {
                try {
                    // Tentar obter MAC address via API do backend (se disponível)
                    const macResponse = await fetch(`${this.apiBaseUrl}/player/hardware-info`);
                    if (macResponse.ok) {
                        const macData = await macResponse.json();
                        return macData.macAddress || null;
                    }
                } catch (error) {
                    console.warn('⚠️ Não foi possível obter MAC address via API');
                }
                
                // Fallback: retornar null (backend irá validar de outra forma)
                return null;
            }
            
            async collectHardwareInfo() {
                try {
                    // Coletar informações de hardware via API do backend
                    const hardwareResponse = await fetch(`${this.apiBaseUrl}/player/hardware-info`);
                    let hardwareInfo = {};
                    
                    if (hardwareResponse.ok) {
                        hardwareInfo = await hardwareResponse.json();
                    } else {
                        // Fallback: coletar informações básicas do navegador
                        hardwareInfo = {
                            userAgent: navigator.userAgent,
                            platform: navigator.platform,
                            language: navigator.language,
                            screenWidth: screen.width,
                            screenHeight: screen.height,
                            timestamp: Date.now()
                        };
                    }
                    
                    // Gerar hash único para identificação
                    const hardwareString = JSON.stringify(hardwareInfo);
                    const hardwareHash = await this.sha256(hardwareString);
                    
                    return {
                        ...hardwareInfo,
                        hardwareHash: hardwareHash
                    };
                } catch (error) {
                    console.error('❌ Erro ao coletar informações de hardware:', error);
                    return {
                        userAgent: navigator.userAgent,
                        platform: navigator.platform,
                        timestamp: Date.now()
                    };
                }
            }
            
            async sha256(message) {
                // Gerar hash SHA-256 usando Web Crypto API
                const msgBuffer = new TextEncoder().encode(message);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                return hashHex;
            }
            
            async generateUIN(hardwareInfo) {
                try {
                    // Gerar UIN baseado em hardware info
                    const uinData = {
                        mac: hardwareInfo.macAddress || hardwareInfo.mac || 'unknown',
                        hostname: hardwareInfo.hostname || 'unknown',
                        platform: hardwareInfo.platform || 'unknown',
                        arch: hardwareInfo.arch || 'unknown',
                        hash: hardwareInfo.hardwareHash || 'unknown'
                    };
                    
                    const uinString = JSON.stringify(uinData);
                    const uinHash = await this.sha256(uinString);
                    
                    // Formato: SSP-{hash_16_primeiros_caracteres}
                    const uin = `SSP-${uinHash.substring(0, 16)}`;
                    
                    return uin;
                } catch (error) {
                    console.error('❌ Erro ao gerar UIN:', error);
                    // Fallback: UIN baseado em timestamp + random
                    return `SSP-${Date.now().toString(36)}${Math.random().toString(36).substring(2, 8)}`;
                }
            }
            
            async autoRegister() {
                const startTime = Date.now();
                const requestId = `PLAYER-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`;
                
                try {
                    console.log(`[${requestId}] 📡 Iniciando auto-registro no servidor...`);
                    console.log(`[${requestId}] 🌐 API Base URL: ${this.apiBaseUrl}`);
                    
                    // Coletar informações de hardware
                    console.log(`[${requestId}] 🔧 Coletando informações de hardware...`);
                    let hardwareInfo;
                    try {
                        hardwareInfo = await this.collectHardwareInfo();
                        console.log(`[${requestId}] ✅ Hardware coletado:`, {
                            ...hardwareInfo,
                            hardwareHash: hardwareInfo.hardwareHash ? 'PRESENTE' : 'AUSENTE'
                        });
                    } catch (hwError) {
                        console.error(`[${requestId}] ❌ Erro ao coletar hardware:`, hwError);
                        // Continuar com hardware básico
                        hardwareInfo = {
                            userAgent: navigator.userAgent,
                            platform: navigator.platform,
                            timestamp: Date.now()
                        };
                        console.warn(`[${requestId}] ⚠️ Usando hardware básico devido a erro`);
                    }
                    
                    // Gerar UIN baseado em hardware
                    console.log(`[${requestId}] 🔑 Gerando UIN...`);
                    let generatedUIN;
                    try {
                        generatedUIN = await this.generateUIN(hardwareInfo);
                        console.log(`[${requestId}] ✅ UIN gerado: ${generatedUIN}`);
                    } catch (uinError) {
                        console.error(`[${requestId}] ❌ Erro ao gerar UIN:`, uinError);
                        // Fallback: UIN baseado em timestamp + random
                        generatedUIN = `SSP-${Date.now().toString(36)}${Math.random().toString(36).substring(2, 8)}`;
                        console.warn(`[${requestId}] ⚠️ Usando UIN de fallback: ${generatedUIN}`);
                    }
                    
                    // Enviar para servidor para registro
                    console.log(`[${requestId}] 📤 Enviando requisição de registro...`);
                    const requestBody = {
                        uin: generatedUIN,
                        hardware: hardwareInfo
                    };
                    console.log(`[${requestId}] 📋 Payload:`, JSON.stringify({
                        ...requestBody,
                        hardware: {
                            ...requestBody.hardware,
                            hardwareHash: requestBody.hardware.hardwareHash ? 'HASH_PRESENTE' : 'AUSENTE'
                        }
                    }, null, 2));
                    
                    let registerResponse;
                    try {
                        registerResponse = await fetch(`${this.apiBaseUrl}/player/register`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(requestBody)
                        });
                        console.log(`[${requestId}] 📥 Resposta recebida:`, {
                            status: registerResponse.status,
                            statusText: registerResponse.statusText,
                            ok: registerResponse.ok
                        });
                    } catch (fetchError) {
                        console.error(`[${requestId}] ❌ Erro de rede ao enviar requisição:`, fetchError);
                        return { 
                            success: false, 
                            error: `Erro de conexão: ${fetchError.message}`,
                            requestId: requestId,
                            details: {
                                apiBaseUrl: this.apiBaseUrl,
                                endpoint: `${this.apiBaseUrl}/player/register`,
                                error: fetchError.message
                            }
                        };
                    }
                    
                    // Verificar resposta
                    let responseData;
                    try {
                        const responseText = await registerResponse.text();
                        console.log(`[${requestId}] 📄 Resposta bruta:`, responseText.substring(0, 500));
                        
                        try {
                            responseData = JSON.parse(responseText);
                        } catch (parseError) {
                            console.error(`[${requestId}] ❌ Erro ao parsear JSON:`, parseError);
                            console.error(`[${requestId}] ❌ Resposta completa:`, responseText);
                            return { 
                                success: false, 
                                error: 'Resposta inválida do servidor',
                                requestId: requestId,
                                details: {
                                    status: registerResponse.status,
                                    responseText: responseText.substring(0, 500)
                                }
                            };
                        }
                    } catch (readError) {
                        console.error(`[${requestId}] ❌ Erro ao ler resposta:`, readError);
                        return { 
                            success: false, 
                            error: `Erro ao ler resposta: ${readError.message}`,
                            requestId: requestId
                        };
                    }
                    
                    if (!registerResponse.ok) {
                        console.error(`[${requestId}] ❌ Erro no auto-registro:`, responseData);
                        return { 
                            success: false, 
                            error: responseData.error || `Erro HTTP ${registerResponse.status}`,
                            details: responseData.details || responseData,
                            requestId: responseData.requestId || requestId,
                            httpStatus: registerResponse.status
                        };
                    }
                    
                    console.log(`[${requestId}] ✅ Auto-registro concluído:`, {
                        success: responseData.success,
                        uin: responseData.uin,
                        requestId: responseData.requestId,
                        duration: responseData.duration
                    });
                    
                    // Salvar UIN localmente
                    if (responseData.uin) {
                        localStorage.setItem('totemUIN', responseData.uin);
                        this.uin = responseData.uin;
                        console.log(`[${requestId}] 💾 UIN salvo no localStorage: ${responseData.uin}`);
                        
                        // Gerar arquivo de configuração encriptado (se possível)
                        if (responseData.token) {
                            this.token = responseData.token;
                            localStorage.setItem('totemToken', responseData.token);
                            console.log(`[${requestId}] 🔐 Token salvo`);
                        }
                    }
                    
                    const duration = Date.now() - startTime;
                    return {
                        success: true,
                        uin: responseData.uin || generatedUIN,
                        totem: responseData.totem,
                        message: responseData.message,
                        requestId: responseData.requestId || requestId,
                        duration: `${duration}ms`
                    };
                } catch (error) {
                    const duration = Date.now() - startTime;
                    console.error(`[${requestId}] ❌ Erro no auto-registro após ${duration}ms:`, error);
                    console.error(`[${requestId}] ❌ Stack trace:`, error.stack);
                    
                    return { 
                        success: false, 
                        error: error.message || 'Erro desconhecido',
                        requestId: requestId,
                        duration: `${duration}ms`,
                        details: {
                            name: error.name,
                            message: error.message,
                            stack: error.stack
                        }
                    };
                }
            }
            
            async exitKioskMode() {
                try {
                    // Tentar chamar o backend para executar comando de saída do kiosk
                    const exitResponse = await fetch(`${this.apiBaseUrl}/player/exit-kiosk`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            uin: this.uin,
                            token: this.token
                        })
                    });
                    
                    if (exitResponse.ok) {
                        console.log('✅ Comando de saída do kiosk enviado ao backend');
                    }
                } catch (error) {
                    console.warn('⚠️ Não foi possível enviar comando de saída ao backend:', error);
                }
                
                // Tentar fechar o navegador (se permitido)
                try {
                    // Para navegadores em modo kiosk, pode precisar de um pequeno delay
                    setTimeout(() => {
                        if (window.close) {
                            window.close();
                        }
                    }, 500);
                } catch (error) {
                    console.warn('⚠️ Não foi possível fechar a janela:', error);
                }
                
                // Se não conseguiu fechar, tentar fazer logout do usuário via comando do sistema
                // Isso será feito pelo backend se o endpoint /player/exit-kiosk existir
                // Por enquanto, redirecionar para uma página que indica saída
                setTimeout(() => {
                    window.location.href = '/player/exit';
                }, 1000);
            }

            async validateTotem() {
                try {
                    if (!this.uin || this.uin.trim() === '') {
                        console.error('❌ UIN vazio na validação');
                        return { 
                            valid: false, 
                            error: 'UIN não fornecido',
                            pendingApproval: false,
                            blocked: false
                        };
                    }
                    
                    console.log(`🔍 Validando totem com UIN: ${this.uin}`);
                    console.log(`🌐 API Base URL: ${this.apiBaseUrl}`);
                    
                    // Gerar token inicial com timeout
                    const tokenController = new AbortController();
                    const tokenTimeout = setTimeout(() => tokenController.abort(), 10000); // 10 segundos
                    
                    let tokenResponse;
                    try {
                        tokenResponse = await fetch(`${this.apiBaseUrl}/player/token?uin=${encodeURIComponent(this.uin)}`, {
                            signal: tokenController.signal
                        });
                        clearTimeout(tokenTimeout);
                    } catch (fetchError) {
                        clearTimeout(tokenTimeout);
                        if (fetchError.name === 'AbortError') {
                            console.error('❌ Timeout ao gerar token de validação (10s)');
                            return { 
                                valid: false, 
                                error: 'Timeout ao conectar com o servidor. Verifique a conexão de rede.',
                                pendingApproval: false,
                                blocked: false
                            };
                        }
                        throw fetchError;
                    }
                    
                    if (!tokenResponse.ok) {
                        const errorText = await tokenResponse.text();
                        console.error('❌ Erro ao gerar token:', tokenResponse.status, errorText);
                        return { 
                            valid: false, 
                            error: `Erro ao gerar token: ${tokenResponse.status} ${tokenResponse.statusText}`,
                            pendingApproval: false,
                            blocked: false
                        };
                    }
                    
                    const tokenData = await tokenResponse.json();
                    this.token = tokenData.token;
                    console.log('✅ Token gerado com sucesso');

                    // Validar totem com token e obter dados completos
                    const validateController = new AbortController();
                    const validateTimeout = setTimeout(() => validateController.abort(), 10000); // 10 segundos
                    
                    let validateResponse;
                    try {
                        validateResponse = await fetch(
                            `${this.apiBaseUrl}/player/validate?uin=${encodeURIComponent(this.uin)}&token=${encodeURIComponent(this.token)}`,
                            {
                                signal: validateController.signal
                            }
                        );
                        clearTimeout(validateTimeout);
                    } catch (fetchError) {
                        clearTimeout(validateTimeout);
                        if (fetchError.name === 'AbortError') {
                            console.error('❌ Timeout ao validar totem (10s)');
                            return { 
                                valid: false, 
                                error: 'Timeout ao validar totem. Verifique a conexão com o servidor.',
                                pendingApproval: false,
                                blocked: false
                            };
                        }
                        throw fetchError;
                    }
                    
                    if (!validateResponse.ok) {
                        let errorData;
                        try {
                            errorData = await validateResponse.json();
                        } catch {
                            errorData = { error: `Erro HTTP ${validateResponse.status}` };
                        }
                        
                        console.error('❌ Erro na validação:', validateResponse.status, errorData);
                        
                        return { 
                            valid: false, 
                            error: errorData.error || 'Totem inválido ou não autorizado',
                            blocked: errorData.blocked || false,
                            pendingApproval: errorData.pendingApproval || false,
                            reason: errorData.reason || null
                        };
                    }
                    
                    const validateData = await validateResponse.json();
                    this.totemData = validateData.totem;
                    this.token = validateData.token;
                    this.pendingCommands = validateData.pendingCommands || [];
                    this.playlist = validateData.playlist;
                    
                    console.log('✅ Totem validado com sucesso:', {
                        totemId: this.totemData?.id,
                        identifier: this.totemData?.identifier,
                        status: this.totemData?.status
                    });
                    
                    // Salvar para próximo carregamento
                    localStorage.setItem('totemUIN', this.uin);
                    localStorage.setItem('totemToken', this.token);
                    
                    return { valid: true };
                } catch (error) {
                    console.error('❌ Erro ao validar totem:', error);
                    return { 
                        valid: false, 
                        error: `Erro ao validar totem: ${error.message || 'Erro desconhecido'}. Verifique a conexão com o servidor.`,
                        pendingApproval: false,
                        blocked: false
                    };
                }
            }

            async executePendingCommands() {
                if (!this.pendingCommands || this.pendingCommands.length === 0) {
                    return;
                }

                const executedCommandIds = [];

                for (const cmd of this.pendingCommands) {
                    try {
                        console.log(`📨 Executando comando: ${cmd.type}`, cmd.data);
                        
                        switch (cmd.type) {
                            case 'reboot':
                                // Programar reboot (pode ser após X segundos)
                                const delay = cmd.data?.delay || 0;
                                setTimeout(() => {
                                    if (confirm('Sistema será reiniciado. Continuar?')) {
                                        location.reload(); // Em produção, usar comando real de reboot
                                    }
                                }, delay * 1000);
                                executedCommandIds.push(cmd.id);
                                break;
                                
                            case 'update_playlist':
                                // Recarregar playlist
                                await this.validateTotem();
                                if (this.playlist) {
                                    await this.loadPlaylist(this.playlist);
                                }
                                executedCommandIds.push(cmd.id);
                                break;
                                
                            case 'change_brightness':
                                // Ajustar brilho (se possível via API do sistema)
                                if (cmd.data?.brightness !== undefined) {
                                    console.log(`💡 Ajustando brilho para: ${cmd.data.brightness}%`);
                                    // Implementar ajuste de brilho se disponível
                                }
                                executedCommandIds.push(cmd.id);
                                break;
                                
                            case 'play_media':
                                // Reproduzir mídia específica
                                if (cmd.data?.mediaId) {
                                    // Buscar mídia na playlist e reproduzir
                                    const mediaIndex = this.playlist?.items?.findIndex(item => item.media?.id === cmd.data.mediaId);
                                    if (mediaIndex !== undefined && mediaIndex >= 0) {
                                        this.currentMediaIndex = mediaIndex;
                                        this.playMedia(this.mediaElements[mediaIndex]);
                                    }
                                }
                                executedCommandIds.push(cmd.id);
                                break;
                                
                            default:
                                console.warn(`⚠️ Tipo de comando desconhecido: ${cmd.type}`);
                                executedCommandIds.push(cmd.id);
                        }
                    } catch (error) {
                        console.error(`❌ Erro ao executar comando ${cmd.id}:`, error);
                    }
                }

                // Marcar comandos como executados no próximo heartbeat
                if (executedCommandIds.length > 0) {
                    this.executedCommands = executedCommandIds;
                }
            }

            async loadPlaylist(playlist) {
                if (!playlist || !playlist.items || playlist.items.length === 0) {
                    throw new Error('Playlist vazia ou inválida');
                }

                console.log(`📋 Carregando playlist: ${playlist.name} com ${playlist.items.length} itens`);

                const container = document.getElementById('content');
                container.innerHTML = '';

                this.mediaElements = [];

                for (let i = 0; i < playlist.items.length; i++) {
                    const item = playlist.items[i];
                    const media = item.media;

                    if (!media || !media.path) {
                        console.warn(`⚠️ Mídia ${i} inválida ou sem caminho`);
                        continue;
                    }

                    const mediaUrl = `${this.apiBaseUrl.replace('/api', '')}/media/${media.path}`;
                    const mediaElement = this.createMediaElement(mediaUrl, media.mimeType || media.type);
                    
                    mediaElement.classList.add('media-item');
                    if (i === 0) {
                        mediaElement.classList.add('active');
                    }

                    container.appendChild(mediaElement);
                    this.mediaElements.push({
                        element: mediaElement,
                        duration: item.duration || media.durationSeconds || 10000,
                        media: media
                    });
                }

                console.log(`✅ ${this.mediaElements.length} mídias carregadas`);
            }

            createMediaElement(url, mimeType) {
                const element = document.createElement(mimeType?.startsWith('video') ? 'video' : 'img');
                element.src = url;
                element.style.width = '100%';
                element.style.height = '100%';
                element.style.objectFit = 'contain';

                if (mimeType?.startsWith('video')) {
                    element.controls = false;
                    element.autoplay = false;
                    element.loop = false;
                    element.muted = true; // Sem áudio por padrão em totens
                    element.addEventListener('error', (e) => {
                        console.error('❌ Erro ao carregar vídeo:', url, e);
                    });
                } else {
                    element.addEventListener('error', (e) => {
                        console.error('❌ Erro ao carregar imagem:', url, e);
                    });
                }

                return element;
            }

            startPlayback() {
                if (this.mediaElements.length === 0) {
                    console.warn('⚠️ Nenhuma mídia para reproduzir');
                    return;
                }

                this.currentMediaIndex = 0;
                this.playMedia(this.mediaElements[0]);

                console.log('▶️ Reprodução iniciada');
            }

            playMedia(mediaData) {
                if (!mediaData || !mediaData.element) {
                    return;
                }

                // Ocultar todas as mídias
                this.mediaElements.forEach(m => m.element.classList.remove('active'));

                // Mostrar mídia atual
                mediaData.element.classList.add('active');
                
                const element = mediaData.element;
                const duration = mediaData.duration || 10000;

                if (element.tagName === 'VIDEO') {
                    element.currentTime = 0;
                    element.play().then(() => {
                        console.log(`▶️ Reproduzindo vídeo: ${mediaData.media?.name || 'sem nome'}`);
                    }).catch(error => {
                        console.error('❌ Erro ao reproduzir vídeo:', error);
                        // Continuar para próxima mídia após duração
                        setTimeout(() => this.nextMedia(), duration);
                    });

                    // Avançar para próxima quando vídeo terminar ou após duração
                    element.addEventListener('ended', () => {
                        this.nextMedia();
                    });

                    const durationTimeout = setTimeout(() => {
                        if (!element.ended) {
                            element.pause();
                            this.nextMedia();
                        }
                    }, duration);
                } else {
                    // Imagem - avançar após duração
                    console.log(`🖼️ Exibindo imagem: ${mediaData.media?.name || 'sem nome'}`);
                    setTimeout(() => {
                        this.nextMedia();
                    }, duration);
                }
            }

            nextMedia() {
                if (this.mediaElements.length === 0) {
                    return;
                }

                this.currentMediaIndex = (this.currentMediaIndex + 1) % this.mediaElements.length;
                
                // Se voltou ao início, recarregar playlist para verificar atualizações
                if (this.currentMediaIndex === 0) {
                    this.checkPlaylistUpdates();
                }

                this.playMedia(this.mediaElements[this.currentMediaIndex]);
            }

            async checkPlaylistUpdates() {
                try {
                    const validation = await this.validateTotem();
                    if (validation.valid && this.playlist) {
                        const newPlaylist = validation.playlist;
                        if (newPlaylist && JSON.stringify(newPlaylist) !== JSON.stringify(this.playlist)) {
                            console.log('🔄 Playlist atualizada, recarregando...');
                            await this.loadPlaylist(newPlaylist);
                            this.currentMediaIndex = 0;
                            this.playMedia(this.mediaElements[0]);
                        }
                    }
                } catch (error) {
                    console.error('❌ Erro ao verificar atualizações de playlist:', error);
                }
            }

            startHeartbeat() {
                // Heartbeat a cada 60 segundos
                this.heartbeatInterval = setInterval(() => {
                    this.sendHeartbeat();
                }, 60000);

                // Enviar primeiro heartbeat após 5 segundos
                setTimeout(() => this.sendHeartbeat(), 5000);
            }

            async sendHeartbeat() {
                if (!this.uin || !this.token) {
                    return;
                }

                try {
                    const response = await fetch(`${this.apiBaseUrl}/player/heartbeat?uin=${encodeURIComponent(this.uin)}&token=${encodeURIComponent(this.token)}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                            executedCommands: this.executedCommands || [],
                            metrics: {
                                currentMediaIndex: this.currentMediaIndex,
                                playlistId: this.playlist?.id,
                                uptime: Math.floor((Date.now() - this.startTime) / 1000)
                            }
                            })
                        });

                    if (response.ok) {
                        const data = await response.json();
                        this.token = data.token;
                        localStorage.setItem('totemToken', this.token);

                        // Executar novos comandos pendentes
                        if (data.pendingCommands && data.pendingCommands.length > 0) {
                            this.pendingCommands = data.pendingCommands;
                            await this.executePendingCommands();
                        }
                    }
                } catch (error) {
                    console.error('❌ Erro ao enviar heartbeat:', error);
                }
            }

            startPlaylistCheck() {
                // Verificar atualizações de playlist a cada 5 minutos
                this.playlistInterval = setInterval(() => {
                    this.checkPlaylistUpdates();
                }, 300000); // 5 minutos
            }

            showError(message) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('player-container').style.display = 'none';
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'flex';
                errorDiv.innerHTML = `
                    <h2 style="color:#ff4444;">❌ Erro ao Carregar Player</h2>
                    <p style="margin-top:20px;font-size:16px;color:#fff;max-width:800px;">${message}</p>
                    <div style="margin-top:30px;font-size:14px;color:#ccc;max-width:800px;">
                        <p><strong>Smart Signage Pro</strong> — Plataforma completa de sinalização digital</p>
                        <div style="margin-top:20px;padding:20px;background:rgba(255,68,68,0.1);border-radius:8px;border:1px solid rgba(255,68,68,0.3);">
                            <p style="margin:0;font-size:13px;color:#ffaaaa;">
                                <strong>UIN Atual:</strong> ${this.uin || 'N/A'}<br>
                                <strong>API URL:</strong> ${this.apiBaseUrl || 'N/A'}<br>
                                <strong>Status:</strong> Erro de Validação
                            </p>
                        </div>
                        <p style="margin-top:20px;font-size:13px;color:#888;">
                            <strong>Soluções possíveis:</strong><br>
                            1. Verifique se o UIN está correto na URL: ?uin=SEU_UIN<br>
                            2. Verifique se o totem está registrado no sistema<br>
                            3. Verifique a conexão com o servidor<br>
                            4. Entre em contato com o administrador do sistema
                        </p>
                    </div>
                `;
            }

            showPendingApprovalPage(message) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('player-container').style.display = 'none';
                const error = document.getElementById('error');
                error.style.display = 'flex';
                error.innerHTML = `
                    <h2 style="color:#2196f3;">Aguardando Aprovação</h2>
                    <div style="margin-top:20px;font-size:16px;color:#fff;">
                        <p style="margin-bottom:20px;">${message || 'Este totem foi auto-registrado e está aguardando aprovação do administrador.'}</p>
                        <div style="margin-top:30px;font-size:14px;color:#ccc;max-width:800px;">
                            <p><strong>Smart Signage Pro</strong> — Plataforma completa de sinalização digital para redes de totens e Smart TVs.</p>
                            <ul style="text-align:left; margin: 20px auto; max-width:600px; line-height:1.8;">
                                <li>✅ Totem registrado com sucesso</li>
                                <li>⏳ Aguardando aprovação do administrador</li>
                                <li>📋 Após aprovação, o totem será ativado automaticamente</li>
                                <li>🔄 Esta página será atualizada automaticamente quando aprovado</li>
                            </ul>
                            <div style="margin-top:30px;padding:20px;background:rgba(33,150,243,0.1);border-radius:8px;border:1px solid rgba(33,150,243,0.3);">
                                <p style="margin:0;font-size:13px;color:#90caf9;">
                                    <strong>UIN:</strong> ${this.uin || 'N/A'}<br>
                                    <strong>Status:</strong> Pendente de Aprovação
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                
                // Verificar atualização de status a cada 30 segundos
                setInterval(async () => {
                    try {
                        const validation = await this.validateTotem();
                        if (validation.valid && !validation.pendingApproval) {
                            // Totem foi aprovado, recarregar página
                            location.reload();
                        }
                    } catch (error) {
                        console.warn('⚠️ Erro ao verificar status de aprovação:', error);
                    }
                }, 30000); // Verificar a cada 30 segundos
            }

            showBlockedPage(reason) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('player-container').style.display = 'none';
                const error = document.getElementById('error');
                error.style.display = 'flex';
                error.innerHTML = `
                    <h2 style="color:#ffcc00;">Totem Bloqueado</h2>
                    <p style="margin-top:10px;">${reason || 'Acesso temporariamente bloqueado.'}</p>
                    <div style="margin-top:30px;font-size:14px;color:#ccc;max-width:800px;">
                        <p><strong>Smart Signage Pro</strong> — Plataforma completa de sinalização digital para redes de totens e Smart TVs.</p>
                        <ul style="text-align:left; margin: 10px auto; max-width:600px; line-height:1.6;">
                            <li>Playlists dinâmicas com regras e campanhas</li>
                            <li>Player seguro com validação por UIN (HMAC)</li>
                            <li>Comandos remotos e heartbeat</li>
                            <li>Analytics e relatórios</li>
                        </ul>
                        <p>Entre em contato para desbloqueio e planos comerciais.</p>
                    </div>
                `;
            }

            hideLoading() {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('player-container').style.display = 'block';
            }

            /**
             * Modo Demo Local
             * Toca uma vinheta demo local em loop sem se registrar no servidor
             */
            startDemoMode() {
                console.log('🎬 Iniciando modo demo local...');
                
                // Ocultar loading
                document.getElementById('loading').style.display = 'none';
                
                // Mostrar player container
                const container = document.getElementById('player-container');
                container.style.display = 'block';
                
                // Criar elemento de vídeo/imagem para demo
                const content = document.getElementById('content');
                content.innerHTML = '';
                
                // Criar vinheta demo local (SVG simples como fallback)
                const demoElement = this.createDemoVinhet();
                content.appendChild(demoElement);
                
                // Iniciar reprodução em loop
                this.startDemoPlayback(demoElement);
                
                console.log('✅ Modo demo iniciado - Vinheta local em loop');
            }

            /**
             * Cria vinheta demo local (SVG simples)
             */
            createDemoVinhet() {
                // Criar SVG simples com animação
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.setAttribute('viewBox', '0 0 1920 1080');
                svg.style.position = 'absolute';
                svg.style.top = '0';
                svg.style.left = '0';
                svg.style.width = '100%';
                svg.style.height = '100%';
                
                // Background gradiente
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                gradient.setAttribute('id', 'demoGradient');
                gradient.setAttribute('x1', '0%');
                gradient.setAttribute('y1', '0%');
                gradient.setAttribute('x2', '100%');
                gradient.setAttribute('y2', '100%');
                
                const stop1 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop1.setAttribute('offset', '0%');
                stop1.setAttribute('stop-color', '#1a237e');
                
                const stop2 = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
                stop2.setAttribute('offset', '100%');
                stop2.setAttribute('stop-color', '#283593');
                
                gradient.appendChild(stop1);
                gradient.appendChild(stop2);
                defs.appendChild(gradient);
                svg.appendChild(defs);
                
                // Retângulo de fundo
                const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                rect.setAttribute('width', '100%');
                rect.setAttribute('height', '100%');
                rect.setAttribute('fill', 'url(#demoGradient)');
                svg.appendChild(rect);
                
                // Texto principal
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', '50%');
                text.setAttribute('y', '45%');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-family', 'Arial, sans-serif');
                text.setAttribute('font-size', '120');
                text.setAttribute('font-weight', 'bold');
                text.setAttribute('fill', '#ffffff');
                text.textContent = 'Smart Signage Pro';
                
                // Animação de fade
                const animate = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
                animate.setAttribute('attributeName', 'opacity');
                animate.setAttribute('values', '0.3;1;0.3');
                animate.setAttribute('dur', '3s');
                animate.setAttribute('repeatCount', 'indefinite');
                text.appendChild(animate);
                svg.appendChild(text);
                
                // Texto secundário
                const subtext = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                subtext.setAttribute('x', '50%');
                subtext.setAttribute('y', '55%');
                subtext.setAttribute('text-anchor', 'middle');
                subtext.setAttribute('font-family', 'Arial, sans-serif');
                subtext.setAttribute('font-size', '48');
                subtext.setAttribute('fill', '#90caf9');
                subtext.textContent = 'Modo Demonstração';
                svg.appendChild(subtext);
                
                // Texto de instruções
                const instructions = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                instructions.setAttribute('x', '50%');
                instructions.setAttribute('y', '70%');
                instructions.setAttribute('text-anchor', 'middle');
                instructions.setAttribute('font-family', 'Arial, sans-serif');
                instructions.setAttribute('font-size', '32');
                instructions.setAttribute('fill', '#b0bec5');
                instructions.textContent = 'Configure o UIN na URL: ?uin=SEU_UIN';
                svg.appendChild(instructions);
                
                // Versão
                const version = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                version.setAttribute('x', '50%');
                version.setAttribute('y', '90%');
                version.setAttribute('text-anchor', 'middle');
                version.setAttribute('font-family', 'Arial, sans-serif');
                version.setAttribute('font-size', '24');
                version.setAttribute('fill', '#78909c');
                version.textContent = 'v2.1.0';
                svg.appendChild(version);
                
                return svg;
            }

            /**
             * Inicia reprodução da vinheta demo em loop
             */
            startDemoPlayback(demoElement) {
                // Duração da vinheta (10 segundos)
                const duration = 10000;
                
                // Função para reiniciar após duração
                const loopPlayback = () => {
                    setTimeout(() => {
                        // Recriar elemento para reiniciar animação
                        const content = document.getElementById('content');
                        content.innerHTML = '';
                        const newDemo = this.createDemoVinhet();
                        content.appendChild(newDemo);
                        loopPlayback();
                    }, duration);
                };
                
                // Iniciar loop
                loopPlayback();
                
                console.log('🔄 Vinheta demo em loop (10s por ciclo)');
            }
        }

        // Inicializar player quando página carregar
        let player;
        if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
                player = new SmartSignagePlayer();
                player.startTime = Date.now();
            });
        } else {
            player = new SmartSignagePlayer();
            player.startTime = Date.now();
        }
    </script>
</body>
</html>
