<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Player v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .player-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .media-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-element {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .video-element {
            width: 100%;
            height: 100%;
        }

        .image-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            font-weight: 500;
            text-align: center;
        }

        .error-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .error-icon {
            font-size: 80px;
            color: #ff4444;
            margin-bottom: 20px;
        }

        .error-text {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .error-details {
            font-size: 16px;
            color: #888;
            text-align: center;
            max-width: 600px;
        }

        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 14px;
            z-index: 100;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-online {
            background: #4caf50;
        }

        .status-offline {
            background: #f44336;
        }

        .status-warning {
            background: #ff9800;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Portrait mode styles */
        @media (orientation: portrait) {
            .media-element {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        }

        /* Landscape mode styles */
        @media (orientation: landscape) {
            .media-element {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <!-- Loading Screen -->
        <div id="loadingScreen" class="loading-screen">
            <div class="loading-spinner"></div>
            <div class="loading-text">Carregando Smart Signage Player...</div>
        </div>

        <!-- Error Screen -->
        <div id="errorScreen" class="error-screen hidden">
            <div class="error-icon">⚠️</div>
            <div class="error-text">Erro no Player</div>
            <div class="error-details" id="errorDetails">
                Não foi possível carregar o conteúdo. Verifique sua conexão e tente novamente.
            </div>
        </div>

        <!-- Media Container -->
        <div class="media-container">
            <video id="videoPlayer" class="media-element video-element hidden" autoplay muted loop>
                Seu navegador não suporta vídeo HTML5.
            </video>
            <img id="imagePlayer" class="media-element image-element hidden" alt="Imagem">
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-left">
                <div class="status-indicator">
                    <div id="connectionStatus" class="status-dot status-offline"></div>
                    <span id="connectionText">Conectando...</span>
                </div>
                <div id="currentTime"></div>
            </div>
            <div class="status-right">
                <div class="status-indicator">
                    <div id="playlistStatus" class="status-dot status-warning"></div>
                    <span id="playlistText">Sincronizando...</span>
                </div>
                <div id="systemInfo">Smart Signage v2.0</div>
            </div>
        </div>
    </div>

    <script>
        class SmartSignagePlayer {
            constructor() {
                this.apiBaseUrl = window.location.origin + '/api';
                this.currentPlaylist = null;
                this.currentMediaIndex = 0;
                this.isPlaying = false;
                this.retryCount = 0;
                this.maxRetries = 3;
                this.heartbeatInterval = null;
                this.playlistCheckInterval = null;
                
                this.videoPlayer = document.getElementById('videoPlayer');
                this.imagePlayer = document.getElementById('imagePlayer');
                this.loadingScreen = document.getElementById('loadingScreen');
                this.errorScreen = document.getElementById('errorScreen');
                this.errorDetails = document.getElementById('errorDetails');
                
                this.init();
            }

            async init() {
                try {
                    console.log('🚀 Iniciando Smart Signage Player v2.0...');
                    
                    // Configurar event listeners
                    this.setupEventListeners();
                    
                    // Verificar conexão
                    await this.checkConnection();
                    
                    // Carregar playlist inicial
                    await this.loadPlaylist();
                    
                    // Iniciar heartbeat
                    this.startHeartbeat();
                    
                    // Iniciar verificação de playlist
                    this.startPlaylistCheck();
                    
                    console.log('✅ Player inicializado com sucesso');
                    
                } catch (error) {
                    console.error('❌ Erro ao inicializar player:', error);
                    this.showError('Erro ao inicializar player', error.message);
                }
            }

            setupEventListeners() {
                // Video events
                this.videoPlayer.addEventListener('loadstart', () => {
                    console.log('📹 Iniciando carregamento do vídeo');
                });

                this.videoPlayer.addEventListener('canplay', () => {
                    console.log('📹 Vídeo pronto para reprodução');
                    this.hideLoading();
                });

                this.videoPlayer.addEventListener('error', (e) => {
                    console.error('❌ Erro no vídeo:', e);
                    this.handleMediaError('Erro ao carregar vídeo');
                });

                this.videoPlayer.addEventListener('ended', () => {
                    console.log('📹 Vídeo finalizado');
                    this.nextMedia();
                });

                // Image events
                this.imagePlayer.addEventListener('load', () => {
                    console.log('🖼️ Imagem carregada');
                    this.hideLoading();
                });

                this.imagePlayer.addEventListener('error', (e) => {
                    console.error('❌ Erro na imagem:', e);
                    this.handleMediaError('Erro ao carregar imagem');
                });

                // Window events
                window.addEventListener('beforeunload', () => {
                    this.cleanup();
                });

                window.addEventListener('online', () => {
                    console.log('🌐 Conexão restaurada');
                    this.updateConnectionStatus(true);
                });

                window.addEventListener('offline', () => {
                    console.log('🌐 Conexão perdida');
                    this.updateConnectionStatus(false);
                });

                // Keyboard events (for debugging)
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'F11') {
                        e.preventDefault();
                        this.toggleFullscreen();
                    }
                });
            }

            async checkConnection() {
                try {
                    const response = await fetch(`${this.apiBaseUrl}/system/info`, {
                        method: 'GET',
                        timeout: 5000
                    });
                    
                    if (response.ok) {
                        this.updateConnectionStatus(true);
                        return true;
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                } catch (error) {
                    console.warn('⚠️ Erro de conexão:', error);
                    this.updateConnectionStatus(false);
                    return false;
                }
            }

            async loadPlaylist() {
                try {
                    console.log('📋 Carregando playlist...');
                    
                    // Simular carregamento de playlist
                    // Em produção, isso viria da API
                    this.currentPlaylist = {
                        id: 1,
                        name: 'Playlist Demo',
                        items: [
                            {
                                id: 1,
                                type: 'image',
                                url: 'https://picsum.photos/1920/1080?random=1',
                                duration: 5000
                            },
                            {
                                id: 2,
                                type: 'image',
                                url: 'https://picsum.photos/1920/1080?random=2',
                                duration: 5000
                            },
                            {
                                id: 3,
                                type: 'image',
                                url: 'https://picsum.photos/1920/1080?random=3',
                                duration: 5000
                            }
                        ]
                    };

                    this.updatePlaylistStatus(true);
                    console.log('✅ Playlist carregada:', this.currentPlaylist);
                    
                    // Iniciar reprodução
                    this.playCurrentMedia();
                    
                } catch (error) {
                    console.error('❌ Erro ao carregar playlist:', error);
                    this.updatePlaylistStatus(false);
                    this.showError('Erro ao carregar playlist', error.message);
                }
            }

            playCurrentMedia() {
                if (!this.currentPlaylist || !this.currentPlaylist.items.length) {
                    console.warn('⚠️ Nenhuma mídia disponível');
                    return;
                }

                const currentItem = this.currentPlaylist.items[this.currentMediaIndex];
                console.log('▶️ Reproduzindo mídia:', currentItem);

                // Esconder elementos anteriores
                this.videoPlayer.classList.add('hidden');
                this.imagePlayer.classList.add('hidden');

                if (currentItem.type === 'video') {
                    this.playVideo(currentItem);
                } else if (currentItem.type === 'image') {
                    this.playImage(currentItem);
                } else {
                    console.warn('⚠️ Tipo de mídia não suportado:', currentItem.type);
                    this.nextMedia();
                }
            }

            playVideo(item) {
                this.videoPlayer.src = item.url;
                this.videoPlayer.classList.remove('hidden');
                this.videoPlayer.classList.add('fade-in');
                
                this.videoPlayer.play().catch(error => {
                    console.error('❌ Erro ao reproduzir vídeo:', error);
                    this.handleMediaError('Erro ao reproduzir vídeo');
                });
            }

            playImage(item) {
                this.imagePlayer.src = item.url;
                this.imagePlayer.classList.remove('hidden');
                this.imagePlayer.classList.add('fade-in');
                
                // Auto-advance after duration
                setTimeout(() => {
                    this.nextMedia();
                }, item.duration || 5000);
            }

            nextMedia() {
                if (!this.currentPlaylist || !this.currentPlaylist.items.length) {
                    return;
                }

                this.currentMediaIndex = (this.currentMediaIndex + 1) % this.currentPlaylist.items.length;
                console.log('⏭️ Próxima mídia:', this.currentMediaIndex);
                
                this.playCurrentMedia();
            }

            handleMediaError(message) {
                console.error('❌ Erro de mídia:', message);
                
                if (this.retryCount < this.maxRetries) {
                    this.retryCount++;
                    console.log(`🔄 Tentativa ${this.retryCount}/${this.maxRetries}`);
                    
                    setTimeout(() => {
                        this.playCurrentMedia();
                    }, 2000);
                } else {
                    this.showError('Erro de reprodução', message);
                }
            }

            showError(title, details) {
                console.error('❌ Erro:', title, details);
                
                this.errorDetails.textContent = `${title}: ${details}`;
                this.errorScreen.classList.remove('hidden');
                this.loadingScreen.classList.add('hidden');
                
                // Tentar reconectar após 30 segundos
                setTimeout(() => {
                    this.retryConnection();
                }, 30000);
            }

            hideLoading() {
                this.loadingScreen.classList.add('hidden');
            }

            updateConnectionStatus(isOnline) {
                const statusDot = document.getElementById('connectionStatus');
                const statusText = document.getElementById('connectionText');
                
                if (isOnline) {
                    statusDot.className = 'status-dot status-online';
                    statusText.textContent = 'Online';
                } else {
                    statusDot.className = 'status-dot status-offline';
                    statusText.textContent = 'Offline';
                }
            }

            updatePlaylistStatus(isLoaded) {
                const statusDot = document.getElementById('playlistStatus');
                const statusText = document.getElementById('playlistText');
                
                if (isLoaded) {
                    statusDot.className = 'status-dot status-online';
                    statusText.textContent = 'Sincronizado';
                } else {
                    statusDot.className = 'status-dot status-warning';
                    statusText.textContent = 'Sincronizando...';
                }
            }

            updateCurrentTime() {
                const now = new Date();
                const timeString = now.toLocaleTimeString('pt-BR');
                document.getElementById('currentTime').textContent = timeString;
            }

            startHeartbeat() {
                // Atualizar tempo a cada segundo
                setInterval(() => {
                    this.updateCurrentTime();
                }, 1000);

                // Heartbeat para o servidor a cada 30 segundos
                this.heartbeatInterval = setInterval(async () => {
                    try {
                        await fetch(`${this.apiBaseUrl}/totems/heartbeat`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                status: 'online',
                                uptime: Math.floor(performance.now() / 1000),
                                memoryUsage: this.getMemoryUsage(),
                                cpuUsage: 0, // Não disponível no browser
                                lastPlaylistUpdate: new Date().toISOString()
                            })
                        });
                    } catch (error) {
                        console.warn('⚠️ Erro no heartbeat:', error);
                    }
                }, 30000);
            }

            startPlaylistCheck() {
                // Verificar atualizações de playlist a cada 5 minutos
                this.playlistCheckInterval = setInterval(async () => {
                    try {
                        console.log('🔄 Verificando atualizações de playlist...');
                        // Em produção, verificar se há nova playlist
                        // await this.loadPlaylist();
                    } catch (error) {
                        console.warn('⚠️ Erro ao verificar playlist:', error);
                    }
                }, 300000);
            }

            getMemoryUsage() {
                if (performance.memory) {
                    return Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
                }
                return 0;
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }

            async retryConnection() {
                console.log('🔄 Tentando reconectar...');
                this.retryCount = 0;
                this.errorScreen.classList.add('hidden');
                this.loadingScreen.classList.remove('hidden');
                
                await this.init();
            }

            cleanup() {
                if (this.heartbeatInterval) {
                    clearInterval(this.heartbeatInterval);
                }
                if (this.playlistCheckInterval) {
                    clearInterval(this.playlistCheckInterval);
                }
            }
        }

        // Inicializar player quando a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            new SmartSignagePlayer();
        });

        // Prevenir context menu
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Prevenir drag and drop
        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
