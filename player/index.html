<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Signage Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #error {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
            color: #ff4444;
            text-align: center;
            padding: 20px;
        }
        
        #player-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #content {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>Carregando player...</p>
    </div>
    
    <div id="error">
        <h2>Erro ao Carregar Player</h2>
        <p id="error-message"></p>
        <p style="margin-top: 20px; font-size: 14px; color: #888;">Verifique se o UIN do totem foi fornecido corretamente.</p>
    </div>
    
    <div id="player-container">
        <div id="content"></div>
    </div>

    <script>
        // Obter UIN da URL
        const urlParams = new URLSearchParams(window.location.search);
        const uin = urlParams.get('uin') || urlParams.get('UIN') || localStorage.getItem('totemUIN');
        
        // Configuração da API
        const API_BASE_URL = window.location.origin;
        
        let totemData = null;
        let validationToken = null;
        
        // Função para mostrar erro
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            document.getElementById('error-message').textContent = message;
        }
        
        // Função para validar totem
        async function validateTotem() {
            if (!uin) {
                showError('UIN do totem não fornecido. Use ?uin=SEU_UIN na URL.');
                return false;
            }
            
            try {
                // Gerar token inicial
                const tokenResponse = await fetch(`${API_BASE_URL}/api/player/token?uin=${encodeURIComponent(uin)}`);
                if (!tokenResponse.ok) {
                    throw new Error('Falha ao gerar token de validação');
                }
                
                const tokenData = await tokenResponse.json();
                validationToken = tokenData.token;
                
                // Validar totem com token
                const validateResponse = await fetch(
                    `${API_BASE_URL}/api/player/validate?uin=${encodeURIComponent(uin)}&token=${encodeURIComponent(validationToken)}`
                );
                
                if (!validateResponse.ok) {
                    const errorData = await validateResponse.json();
                    throw new Error(errorData.error || 'Totem inválido ou não autorizado');
                }
                
                const validateData = await validateResponse.json();
                totemData = validateData.totem;
                validationToken = validateData.token; // Atualizar token
                
                // Salvar UIN no localStorage para próximo carregamento
                localStorage.setItem('totemUIN', uin);
                localStorage.setItem('totemToken', validationToken);
                
                console.log('✅ Totem validado:', totemData);
                return true;
                
            } catch (error) {
                console.error('❌ Erro ao validar totem:', error);
                showError(error.message || 'Erro ao validar totem. Verifique a conexão com o servidor.');
                return false;
            }
        }
        
        // Função para renovar token periodicamente
        async function renewToken() {
            if (!uin || !validationToken) return;
            
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/player/validate?uin=${encodeURIComponent(uin)}&token=${encodeURIComponent(validationToken)}`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    validationToken = data.token;
                    localStorage.setItem('totemToken', validationToken);
                }
            } catch (error) {
                console.error('Erro ao renovar token:', error);
            }
        }
        
        // Função para carregar conteúdo do player
        async function loadPlayerContent() {
            try {
                // Obter configuração do player
                const configResponse = await fetch(`${API_BASE_URL}/player/config`);
                if (!configResponse.ok) {
                    throw new Error('Falha ao obter configuração do player');
                }
                
                const config = await configResponse.json();
                console.log('Configuração do player:', config);
                
                // Aqui você pode carregar playlists, campanhas, etc. baseado no totemData
                // Por enquanto, apenas mostra mensagem de sucesso
                document.getElementById('loading').style.display = 'none';
                document.getElementById('player-container').style.display = 'block';
                document.getElementById('content').innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px;">
                        <h1 style="font-size: 48px; margin-bottom: 20px;">Smart Signage Player</h1>
                        <p style="font-size: 24px; margin-bottom: 10px;">Totem: ${totemData.name}</p>
                        <p style="font-size: 18px; color: #888;">Localização: ${totemData.location}</p>
                        <p style="font-size: 14px; color: #555; margin-top: 40px;">UIN: ${uin}</p>
                        <p style="font-size: 14px; color: #555;">Status: Conectado e Validado</p>
                    </div>
                `;
                
            } catch (error) {
                console.error('Erro ao carregar conteúdo:', error);
                showError('Erro ao carregar conteúdo do player');
            }
        }
        
        // Inicializar player
        async function init() {
            // Validar totem
            const isValid = await validateTotem();
            if (!isValid) {
                return;
            }
            
            // Carregar conteúdo
            await loadPlayerContent();
            
            // Renovar token a cada 30 minutos
            setInterval(renewToken, 30 * 60 * 1000);
        }
        
        // Iniciar quando página carregar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
